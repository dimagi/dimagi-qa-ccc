# Unsubscribe and resubscribe from a channel (TC-SUB-001, 002, 003, 005).
#
# Mobile-only: consent is a device action (POST /messaging/update_consent/), so
# no web half is needed to drive it. The delivery-blocked pair (TC-SUB-004 /
# TC-SUB-006) is not here - proving a message does not arrive needs a send
# between two device sessions, and a Maestro build cannot be paused midway.
#
# Consent is reversible server-side with no cleanup, so this flow restores the
# subscribed state before it ends and is safe to re-run.
#
# From commcare-android:
#   "More options"      the toolbar overflow's content-desc (no resource-id)
#   Unsubscribe / Resubscribe   overflow items, confirmed by a
#                       CustomThreeButtonAlertDialog
#   etMessage           doubles as the "not subscribed" banner: disabled and
#                       showing connect_messaging_channel_list_not_subscribed
#   imgSendMessage      stays hidden while the channel is unconsented
#   tvUnsubscribedPill  the channel row's unsubscribed marker
#
# NOTE: the confirmation dialog's button labels are inferred from the dialog
# being a three-button alert - if the first run shows different wording, the
# failure screenshot will say so and these two taps get corrected.
appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "7426121"
  USERNAME: "CCC- Automationuser1"
  BACKUP_CODE: "123123"
  CHANNEL_NAME: "connectqa-automation-prod"
  NOT_SUBSCRIBED_TEXT: "You are not subscribed to this messaging channel"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: shared_login_signup.yaml

# Wait for the backup-code screen before testing for it. Maestro's runFlow
# `when` is a POINT-IN-TIME check, not a wait: tapping CONTINUE on the phone
# step starts a server round trip, and this condition used to be evaluated
# milliseconds later, before "Confirm Backup Code" had rendered. The whole block
# was then skipped and the flow walked on to later steps while still sitting on
# the code screen - failing several steps afterwards on an element that never
# had a chance (prod build 81f3043b, where the screenshot shows the code field
# empty and the keyboard still up).
#
# Safe as an unconditional wait because every flow reaching here signs in as an
# established account, which always gets this screen. The signup flow, which may
# not, does not use this block.
- extendedWaitUntil:
    visible:
      id: "backup_code_view"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "backup_code_view"
    commands:
      - assertVisible:
          id: "welcome_back"
      - inputText: "${BACKUP_CODE}"
      - tapOn:
          id: "connect_backup_code_button"
      # The "Account Recovered" dialog lands a moment AFTER the code is
      # accepted, so a single optional tap can run before it exists, warn, and
      # leave the modal sitting over every later tap. Staging build 7712d963
      # failed that way: the screenshot shows the dialog still up, and the flow
      # failing several steps later on a tap that never had a chance.
      #
      # Guarded on the dialog actually being present, and repeated so whichever
      # attempt runs after it appears is the one that dismisses it. Cheap when
      # the dialog never shows, which is the common case.
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  visible:
                    text: ".*Account Recovered.*"
                commands:
                  - tapOn:
                      text: "OKAY|OK"
            - waitForAnimationToEnd:
                timeout: 2500
      - assertNotVisible:
          id: "connect_backup_code_error_message"

- runFlow:
    when:
      notVisible:
        id: "nav_drawer_recycler"
    commands:
      - tapOn:
          text: "Open navigation drawer"
      - extendedWaitUntil:
          visible:
            id: "nav_drawer_recycler"
          timeout: 15000

# Open Messaging from the drawer, and retry until the Channels screen is really
# there.
#
# The drawer is opened by completeSignin() and slides in. Tapping a row while
# that animation is still running is accepted by Maestro - the row's final
# bounds are already in the view hierarchy, and the ripple registers as
# "Something have changed in the UI judging by view hierarchy" - but
# DrawerLayout swallows the touch. The tap reports COMPLETED and nothing
# navigates.
#
# Prod build 2b090dc6 is exactly that: "Tap on Messaging COMPLETED" at 16:41:06,
# the Channels assertion failing 60s later, and the failure screenshot still
# showing the drawer wide open over the home screen. Same shape as the
# notification banner and the backup-code guard - a step that succeeds while
# doing nothing.
#
# That one swallowed tap was expensive out of proportion to itself: it stranded
# a half-answered survey on the channel, and the next two tests sent their
# keywords into that open survey instead of to keyword processing. See the note
# on the keyword flows.
#
# So settle first, then retry the tap while Channels is still absent. The tap is
# optional because a swallowed tap reports success anyway and therefore cannot
# be the thing that decides this worked; the wait after the loop is.
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
              text: "Channels"
          commands:
            - tapOn:
                text: "Messaging"
                optional: true
            - waitForAnimationToEnd:
                timeout: 5000
- extendedWaitUntil:
    visible:
      text: "Channels"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "${CHANNEL_NAME}"
    timeout: 120000
- tapOn:
    text: "${CHANNEL_NAME}"
- extendedWaitUntil:
    visible:
      id: "etMessage"
    timeout: 60000

# --- TC-SUB-001: unsubscribe ---
- tapOn:
    text: "More options"
- tapOn:
    text: "Unsubscribe"
- tapOn:
    text: "Unsubscribe"

# --- TC-SUB-002: sending is disabled and the banner explains why ---
- extendedWaitUntil:
    visible:
      text: ".*${NOT_SUBSCRIBED_TEXT}.*"
    timeout: 30000
- assertNotVisible:
    id: "imgSendMessage"

# --- TC-SUB-003: the channel row is marked unsubscribed ---
- back
- extendedWaitUntil:
    visible:
      text: "Channels"
    timeout: 30000
- assertVisible:
    id: "tvUnsubscribedPill"

# --- TC-SUB-005: resubscribe restores the channel ---
- tapOn:
    text: "${CHANNEL_NAME}"
- extendedWaitUntil:
    visible:
      id: "etMessage"
    timeout: 30000
- tapOn:
    text: "More options"
- tapOn:
    text: "Resubscribe"
- tapOn:
    text: "Resubscribe"

# The composer works again: typing makes the send control appear, which it only
# does when the channel is consented AND the input is non-empty. That is a
# stronger check than the banner merely disappearing.
- extendedWaitUntil:
    notVisible:
      text: ".*${NOT_SUBSCRIBED_TEXT}.*"
    timeout: 30000
- tapOn:
    id: "etMessage"
- inputText: "resubscribed"
- assertVisible:
    id: "imgSendMessage"
- eraseText

# ...and the row is no longer flagged, leaving the account as it was found.
#
# Two Backs, conditionally: the composer still holds focus after typing, so the
# first Back dismisses the soft keyboard rather than navigating and the screen
# stays on the thread. The earlier Back in this flow needs no such handling
# because nothing had been typed at that point.
- back
- runFlow:
    when:
      notVisible:
        text: "Channels"
    commands:
      - back
- extendedWaitUntil:
    visible:
      text: "Channels"
    timeout: 30000
- assertNotVisible:
    id: "tvUnsubscribedPill"
