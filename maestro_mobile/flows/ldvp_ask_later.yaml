# LDVP "Ask me later" session (CCCT-2670, TC-PAY-003), after web paid a second
# 50. Dismissing the card with Ask me later must keep it away when the screen is
# opened again, and the transferred total must now include both payments.
appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "7426091"
  USERNAME: "QA LDVP Worker"
  BACKUP_CODE: "609100"
  OPPORTUNITY: "Demo Opportunity"
  TRANSFERRED: "150"
---
- runFlow: shared_ldvp_signin.yaml
- runFlow: shared_ldvp_job_list.yaml
- tapOn:
    text: "${OPPORTUNITY}"
- extendedWaitUntil:
    visible:
      id: "connect_delivery_home_tabs"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "connect_payment_confirm_label"
    timeout: 60000
- tapOn:
    id: "connect_payment_confirm_no_button"
- extendedWaitUntil:
    notVisible:
      id: "connect_payment_confirm_label"
    timeout: 30000
# Leave and come back: the card must stay dismissed.
- back
- extendedWaitUntil:
    visible:
      id: "rvJobList"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "${OPPORTUNITY}"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "${OPPORTUNITY}"
- extendedWaitUntil:
    visible:
      id: "connect_delivery_home_tabs"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    id: "connect_payment_confirm_label"
- tapOn:
    text: "Payments?"
    childOf:
      id: "connect_delivery_home_tabs"
- extendedWaitUntil:
    visible:
      id: "payment_transferred_amount"
    timeout: 30000
- assertVisible:
    id: "payment_transferred_amount"
    text: "(?s).*\\b${TRANSFERRED}\\b.*"
