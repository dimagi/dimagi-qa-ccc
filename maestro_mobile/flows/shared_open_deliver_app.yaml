appId: org.commcare.dalvik
# Sign in, open the long-lived opportunity and land on the deliver app's home
# screen, with the pending-task warning showing (TC-E2E-006, first half).
#
# Shared because the blocked visit and the re-learn task now run as two separate
# device sessions: the web side has to confirm Connect evaluated the blocked visit
# before the task completion is submitted, and it cannot interleave with a running
# session. Env values come from the calling flow - Maestro passes a flow's env down
# into its runFlow subflows.
---
# permissions/all: Android 13 gates POST_NOTIFICATIONS behind a runtime grant, and
# a cleared state re-asks for it. Without it the task-completion push never
# reaches the shade and the wait below could not work.
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: shared_login_signup.yaml

# An existing PersonalID user lands on "Welcome back <name>" and authenticates
# with a backup code; a brand new number skips straight past this.
# Wait for the backup-code screen before testing for it. Maestro's runFlow
# `when` is a POINT-IN-TIME check, not a wait: tapping CONTINUE on the phone
# step starts a server round trip, and this condition used to be evaluated
# milliseconds later, before "Confirm Backup Code" had rendered. The whole block
# was then skipped and the flow walked on to later steps while still sitting on
# the code screen - failing several steps afterwards on an element that never
# had a chance (prod build 81f3043b, where the screenshot shows the code field
# empty and the keyboard still up).
#
# Safe as an unconditional wait because every flow reaching here signs in as an
# established account, which always gets this screen. The signup flow, which may
# not, does not use this block.
- extendedWaitUntil:
    visible:
      id: "backup_code_view"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "backup_code_view"
    commands:
      - assertVisible:
          id: "welcome_back"
      - inputText: "${BACKUP_CODE}"
      - tapOn:
          id: "connect_backup_code_button"
      - tapOn:
          text: "OK"
          optional: true
      - assertNotVisible:
          id: "connect_backup_code_error_message"

# PersonalIdManager.completeSignin() calls openDrawer(), so the nav drawer is
# already showing at this point. Dismiss it, otherwise every tap below lands on
# the drawer scrim instead of the screen behind it. Tap the scrim rather than
# pressing Back - on the setup screen Back closes the activity and drops out of
# the app altogether.
- runFlow:
    when:
      visible:
        id: "nav_drawer_recycler"
    commands:
      - tapOn:
          point: "92%,50%"
      - extendedWaitUntil:
          notVisible:
            id: "nav_drawer_recycler"
          timeout: 15000

# --- Reach the Connect menu ---
# connect_login_button is the "Go to Connect menu" button. It is hidden until the
# app has Connect access, which a fresh install does not have (hasConnectAccess
# is a local flag). When it is missing, the setup screen's "Refresh
# Opportunities" overflow item fetches jobs and turns access on, after which the
# button appears; when it is already there, skip straight past.
- runFlow:
    when:
      notVisible:
        id: "connect_login_button"
    commands:
      - tapOn:
          text: "More options"
      - tapOn: "Refresh Opportunities"
      - extendedWaitUntil:
          visible:
            id: "connect_login_button"
          timeout: 120000

# --- Open the opportunity ---
- tapOn:
    id: "connect_login_button"
- extendedWaitUntil:
    visible:
      id: "rvJobList"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "${OPPORTUNITY}"
    direction: DOWN
    timeout: 20000
# Only a not-yet-accepted opportunity offers "View Opportunity"; btn_start
# ("Start") is what accepts it.
- runFlow:
    when:
      visible:
        id: "btn_view_opportunity"
    commands:
      - tapOn:
          id: "btn_view_opportunity"
      - assertVisible:
          id: "btn_start"
      - tapOn:
          id: "btn_start"
      - tapOn:
          text: "OK"
          optional: true
# The card's title is not clickable - its buttons are. With learning already
# finished the card offers Resume, which downloads the app on a fresh install and
# then opens its home screen. Allow a long timeout: this is a real download.
- tapOn:
    id: "btn_resume"
- extendedWaitUntil:
    visible:
      text: "Sync with Server"
    timeout: 600000

# --- The pending-task warning must be showing (TC-E2E-006, first half) ---
# cv_relearn_tasks_pending is on the deliver app's home job tile as well as the
# Connect delivery-progress card, so it can be checked here without going back.
- extendedWaitUntil:
    visible:
      text: ".*${PENDING_WARNING}.*"
    timeout: 120000

# Sync so the case property set at assignment arrives and unhides the form.
- tapOn: "Sync with Server"
- extendedWaitUntil:
    visible:
      text: ".*Sync Successful.*"
    timeout: 180000
