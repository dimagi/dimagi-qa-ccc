# Worker side of the hybrid keyword test (TC-KWD-002).
#
# Web configures a keyword whose reply is a Connect Message; this flow has the
# worker send that keyword from the channel and asserts the configured reply
# comes back.
#
# This is the only case that exercises the worker-initiated send path with a
# product consequence attached, which is why the plan has no separate "send free
# text" test - a bubble appearing proves the UI drew something, whereas a reply
# proves the message actually reached the server and was processed.
#
# Ids come from commcare-android fragment_connect_message.xml:
#   etMessage        the composer
#   imgSendMessage   GONE until the composer is non-empty AND the channel is
#                    consented, so it is asserted before being tapped
#   tvChatMessage    a bubble's text
#
# IF THIS FAILS AND THE SCREENSHOT SHOWS A SURVEY QUESTION AS THE REPLY, the
# keyword is not broken - it was eaten. An HQ survey session is a stateful
# conversation on the channel, and while one is open EVERY inbound text is
# treated as the answer to the pending question, so the keyword never reaches
# keyword processing at all. Any earlier test that started a survey and died
# before finishing it leaves the channel in that state, and because this worker
# has one channel, every later text-sending test on it inherits the problem.
#
# Prod run 32871098256 is the worked example. The survey test lost a drawer tap,
# stranded its survey at question 1, and then:
#   this flow sent AUTOKW200404  -> channel answered "Define External ID" (Q2)
#   the keyword-survey flow sent AUTOKW955365 -> answered "Enter age"     (Q3)
# One swallowed tap, three red tests, and the survey walked forward a question
# per victim. The tap is fixed below; the tests are also ordered so the
# survey-answering ones run last, which bounds the damage if it recurs.
appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "7426121"
  USERNAME: "CCC- Automationuser1"
  BACKUP_CODE: "123123"
  CHANNEL_NAME: "connectqa-automation-prod"
  # The keyword to send, and the reply HQ is configured to answer it with.
  KEYWORD: "AUTOKW000000"
  EXPECTED_REPLY: "Automation keyword reply"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: shared_login_signup.yaml

# Wait for the backup-code screen before testing for it. Maestro's runFlow
# `when` is a POINT-IN-TIME check, not a wait: tapping CONTINUE on the phone
# step starts a server round trip, and this condition used to be evaluated
# milliseconds later, before "Confirm Backup Code" had rendered. The whole block
# was then skipped and the flow walked on to later steps while still sitting on
# the code screen - failing several steps afterwards on an element that never
# had a chance (prod build 81f3043b, where the screenshot shows the code field
# empty and the keyboard still up).
#
# Safe as an unconditional wait because every flow reaching here signs in as an
# established account, which always gets this screen. The signup flow, which may
# not, does not use this block.
- extendedWaitUntil:
    visible:
      id: "backup_code_view"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "backup_code_view"
    commands:
      - assertVisible:
          id: "welcome_back"
      - inputText: "${BACKUP_CODE}"
      - tapOn:
          id: "connect_backup_code_button"
      # The "Account Recovered" dialog lands a moment AFTER the code is
      # accepted, so a single optional tap can run before it exists, warn, and
      # leave the modal sitting over every later tap. Staging build 7712d963
      # failed that way: the screenshot shows the dialog still up, and the flow
      # failing several steps later on a tap that never had a chance.
      #
      # Guarded on the dialog actually being present, and repeated so whichever
      # attempt runs after it appears is the one that dismisses it. Cheap when
      # the dialog never shows, which is the common case.
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  visible:
                    text: ".*Account Recovered.*"
                commands:
                  - tapOn:
                      text: "OKAY|OK"
            - waitForAnimationToEnd:
                timeout: 2500
      - assertNotVisible:
          id: "connect_backup_code_error_message"

- runFlow:
    when:
      notVisible:
        id: "nav_drawer_recycler"
    commands:
      - tapOn:
          text: "Open navigation drawer"
      - extendedWaitUntil:
          visible:
            id: "nav_drawer_recycler"
          timeout: 15000

# --- Open the channel ---
# Open Messaging from the drawer, and retry until the Channels screen is really
# there.
#
# The drawer is opened by completeSignin() and slides in. Tapping a row while
# that animation is still running is accepted by Maestro - the row's final
# bounds are already in the view hierarchy, and the ripple registers as
# "Something have changed in the UI judging by view hierarchy" - but
# DrawerLayout swallows the touch. The tap reports COMPLETED and nothing
# navigates.
#
# Prod build 2b090dc6 is exactly that: "Tap on Messaging COMPLETED" at 16:41:06,
# the Channels assertion failing 60s later, and the failure screenshot still
# showing the drawer wide open over the home screen. Same shape as the
# notification banner and the backup-code guard - a step that succeeds while
# doing nothing.
#
# That one swallowed tap was expensive out of proportion to itself: it stranded
# a half-answered survey on the channel, and the next two tests sent their
# keywords into that open survey instead of to keyword processing. See the note
# on the keyword flows.
#
# So settle first, then retry the tap while Channels is still absent. The tap is
# optional because a swallowed tap reports success anyway and therefore cannot
# be the thing that decides this worked; the wait after the loop is.
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
              text: "Channels"
          commands:
            - tapOn:
                text: "Messaging"
                optional: true
            - waitForAnimationToEnd:
                timeout: 5000
- extendedWaitUntil:
    visible:
      text: "Channels"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "${CHANNEL_NAME}"
    timeout: 120000
- tapOn:
    text: "${CHANNEL_NAME}"
- extendedWaitUntil:
    visible:
      id: "etMessage"
    timeout: 60000

# --- Send the keyword ---
- tapOn:
    id: "etMessage"
- inputText: "${KEYWORD}"
- assertVisible:
    id: "imgSendMessage"
- tapOn:
    id: "imgSendMessage"

# The outgoing bubble is optimistic - MessageManager stores it locally and shows
# it before the network call - so seeing it proves the UI accepted the input,
# nothing more. The reply below is what proves it reached the server.
- extendedWaitUntil:
    visible:
      text: ".*${KEYWORD}.*"
    timeout: 60000

# --- The configured reply must come back ---
# device -> ConnectID -> HQ keyword processing -> back down over FCM, plus the
# thread's own 30s poll, so allow several minutes.
- extendedWaitUntil:
    visible:
      text: ".*${EXPECTED_REPLY}.*"
    timeout: 420000
- assertVisible:
    id: "tvChatDate"
