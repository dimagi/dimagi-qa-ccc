appId: org.commcare.dalvik
---
# Sub-flow only - invoked via runFlow, never listed in TEST_FLOWS.
#
# The backup-code screen every established PersonalID account gets after
# shared_login_signup.yaml, plus the optional email step that follows it.
#
# This block was copy-pasted into all fifteen messaging_*.yaml flows and into
# shared_open_deliver_app.yaml. When 2.64 added the email step only the
# deliver-app copy was updated, and the fifteen stale copies then failed
# identically on prod run 35588627616: each flow sat on "Add your email
# (optional)", the drawer tap after it timed out, and nine messaging cases went
# red at once for one missing tap. One copy now, so the next product change here
# lands in one place.
#
# Inputs (env, inherited from the calling flow): BACKUP_CODE

# Wait for the backup-code screen before testing for it. Maestro's runFlow
# `when` is a POINT-IN-TIME check, not a wait: tapping CONTINUE on the phone
# step starts a server round trip, and this condition used to be evaluated
# milliseconds later, before "Confirm Backup Code" had rendered. The whole block
# was then skipped and the flow walked on to later steps while still sitting on
# the code screen - failing several steps afterwards on an element that never
# had a chance (prod build 81f3043b, where the screenshot shows the code field
# empty and the keyboard still up).
#
# Safe as an unconditional wait because every flow reaching here signs in as an
# established account, which always gets this screen. The signup flow, which may
# not, does not use this block.
- extendedWaitUntil:
    visible:
      id: "backup_code_view"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "backup_code_view"
    commands:
      - assertVisible:
          id: "welcome_back"
      - inputText: "${BACKUP_CODE}"
      - tapOn:
          id: "connect_backup_code_button"
      # 2.64+ offers an optional email step after the backup code, but only while
      # the account has no verified email and the email_otp_verification switch is
      # on - so both taps are optional rather than asserted. Without them the flow
      # stops on "Add your email (optional)" and every later step fails. The
      # confirm dialog's buttons are Material buttons, which upper-case their
      # labels: YES.
      - tapOn:
          id: "personalid_email_skip_button"
          optional: true
      - tapOn:
          text: "YES"
          optional: true
      # The "Account Recovered" dialog lands a moment AFTER the code is
      # accepted, so a single optional tap can run before it exists, warn, and
      # leave the modal sitting over every later tap. Staging build 7712d963
      # failed that way: the screenshot shows the dialog still up, and the flow
      # failing several steps later on a tap that never had a chance.
      #
      # Prod build b238ea98 is that exactly: the optional OK tap ran at
      # 07:36:01 and WARNED at 07:36:08 having found nothing, the dialog then
      # arrived, and "More options" FAILED at 07:36:27 with the failure
      # screenshot showing "Account Recovered" still up and its OK button
      # unpressed. The tap that mattered had already been spent on an empty
      # screen.
      #
      # Guarded on the dialog actually being present, and repeated so whichever
      # attempt runs after it appears is the one that dismisses it. Cheap when
      # the dialog never shows, which is the common case.
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  visible:
                    text: ".*Account Recovered.*"
                commands:
                  - tapOn:
                      text: "OKAY|OK"
            - waitForAnimationToEnd:
                timeout: 2500
      - assertNotVisible:
          id: "connect_backup_code_error_message"
