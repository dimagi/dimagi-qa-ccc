appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "7426000"
  USERNAME: "Deb Test 8/12"
  BACKUP_CODE: "742600"
---
- launchApp:
    clearState: true
- runFlow: shared_login_signup.yaml
- assertVisible:
    id: "org.commcare.dalvik:id/welcome_back"
    text: "Welcome back ${USERNAME}"
- tapOn:
    id: "org.commcare.dalvik:id/backup_code_view"
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    id: "org.commcare.dalvik:id/backup_code_view"
- inputText: "123456"
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "CONTINUE"
- assertVisible:
    text: ".*You have entered the wrong Backup Code.*"
- tapOn:
    text: "OK"
- tapOn:
    id: "org.commcare.dalvik:id/backup_code_view"
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    id: "org.commcare.dalvik:id/backup_code_view"
- inputText: "${BACKUP_CODE}"
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "CONTINUE"
# 2.64+ offers an optional email step here, but only while the account has no
# verified email and the email_otp_verification switch is on - so both steps are
# optional rather than asserted. The confirm dialog's buttons are Material
# buttons, which upper-case their labels: YES, not Yes.
- tapOn:
    id: "org.commcare.dalvik:id/personalid_email_skip_button"
    optional: true
- tapOn:
    text: "YES"
    optional: true
- tapOn:
    text: "OK"
- assertVisible:
    id: "org.commcare.dalvik:id/header_user_name"
    text: "${USERNAME}"
- tapOn:
    text: "Open navigation drawer"
    optional: true
- assertVisible:
    text: "Opportunities"
- assertVisible:
    text: "CommCare Apps"
- assertVisible:
    text: "Messaging"
- assertVisible:
    text: "Work History"
- assertVisible:
    text: "Notifications"
- assertVisible:
    text: "About CommCare"
- assertVisible:
    text: "GO TO CONNECT MENU"
- tapOn:
    text: "More options"
- tapOn:
    text: "More options"
# Renamed in 2.64 from "Forget PersonalID user" - the Login menu now reuses
# personalid_profile_forget_account. Matched loosely so both spellings work;
# Maestro text selectors are full matches, hence the wildcards.
- tapOn:
    text: ".*Forget PersonalID.*"
- tapOn:
    text: "Open navigation drawer"
- tapOn:
    # The drawer sometimes shows a "Logged out of PersonalID" card after the
    # forget action - dismiss it so the sign-in button is visible again.
    text: "Dismiss"
    optional: true
- assertVisible:
    id: "org.commcare.dalvik:id/nav_drawer_sign_in_button"
