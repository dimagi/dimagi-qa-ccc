# Worker side of the hybrid re-learn tasking test (TC-E2E-001, TC-E2E-006).
#
# Web assigns a re-learn task, this flow has the worker complete it on a real
# device, then web polls until the task flips to Complete.
#
# A BrowserStack session always begins with a freshly installed app, so this has
# to run the whole cold start every time: PersonalID sign-in, granting Connect
# access, then downloading the deliver app. Only the worker's learn/assessment
# progress survives between runs, because that lives on the server against the
# worker+opportunity pair.
#
# Ids and labels come from commcare-android source and the deliver app CCZ:
#   backup_code_view / welcome_back / connect_backup_code_button
#       fragment_recovery_code.xml - 2.63 replaced the old single
#       connect_backup_code_input field with a six-box NumericCodeView whose
#       boxes have index ids, so the code is typed into the focused view.
#   "Refresh Opportunities"
#       CommCareSetupActivity:500 overflow item. On a fresh install
#       hasConnectAccess is false and the drawer has no Opportunities entry;
#       this fetches jobs and calls turnOnConnectAccess when any come back.
#   connect_login_button    SelectInstallModeFragment - appears once access is on
#   rvJobList / btn_view_opportunity / btn_start ("Start" is the accept action)
#   connect_delivery_button / acb_resume - deliver app download and launch
#   PENDING_WARNING         connect_progress_warning_relearn_tasks_pending
#   TASK_MODULE / TASK_FORM en/app_strings.txt (modules.m0, forms.m0f5)
# Ids are bare so the flow also matches debug builds, which add an .debug suffix
# to the applicationId.
appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "3119728"
  USERNAME: "Relearn Task User"
  BACKUP_CODE: "123456"
  OPPORTUNITY: "Demo Opportunity"
  # From the CCZ of the opportunity's OWN deliver app copy (app_id
  # 6b7240a9db5741f49c5e91bd224b3140), not the master: modules.m1 holds the
  # re-learn form, whose task block id is relearn_task - the TaskType slug.
  #
  # The master and the copy disagree on capitalisation ("Re-Learn Task" vs
  # "Re-learn Task", "Re-learn form" vs "Re-learn Form"), and Maestro matches
  # text case-sensitively, so these carry character classes to cover both. Plain
  # classes rather than an inline (?i) flag, which is unproven on 1.39.13.
  # Note "Re-learn [Ff]orm" cannot match "Second Relearn Form" - that one has no
  # hyphen - so the two forms stay distinguishable.
  TASK_MODULE: "Re-[Ll]earn Task"
  TASK_FORM: "Re-learn [Ff]orm"
  TASK_NAME_ANSWER: "Relearn Automation"
  PENDING_WARNING: "Complete assigned tasks to continue delivering services"
  # connect_progress_relearn_tasks_completed - only shown for 6h after completion
  COMPLETED_MESSAGE: "All required tasks have been completed"
---
- launchApp:
    clearState: true
- runFlow: shared_login_signup.yaml

# An existing PersonalID user lands on "Welcome back <name>" and authenticates
# with a backup code; a brand new number skips straight past this.
- runFlow:
    when:
      visible:
        id: "backup_code_view"
    commands:
      - assertVisible:
          id: "welcome_back"
      - inputText: "${BACKUP_CODE}"
      - tapOn:
          id: "connect_backup_code_button"
      - tapOn:
          text: "OK"
          optional: true
      - assertNotVisible:
          id: "connect_backup_code_error_message"

# PersonalIdManager.completeSignin() calls openDrawer(), so the nav drawer is
# already showing at this point. Dismiss it, otherwise every tap below lands on
# the drawer scrim instead of the screen behind it. Tap the scrim rather than
# pressing Back - on the setup screen Back closes the activity and drops out of
# the app altogether.
- runFlow:
    when:
      visible:
        id: "nav_drawer_recycler"
    commands:
      - tapOn:
          point: "92%,50%"
      - extendedWaitUntil:
          notVisible:
            id: "nav_drawer_recycler"
          timeout: 15000

# --- Reach the Connect menu ---
# connect_login_button is the "Go to Connect menu" button. It is hidden until the
# app has Connect access, which a fresh install does not have (hasConnectAccess
# is a local flag). When it is missing, the setup screen's "Refresh
# Opportunities" overflow item fetches jobs and turns access on, after which the
# button appears; when it is already there, skip straight past.
- runFlow:
    when:
      notVisible:
        id: "connect_login_button"
    commands:
      - tapOn:
          text: "More options"
      - tapOn: "Refresh Opportunities"
      - extendedWaitUntil:
          visible:
            id: "connect_login_button"
          timeout: 120000

# --- Open the opportunity ---
- tapOn:
    id: "connect_login_button"
- extendedWaitUntil:
    visible:
      id: "rvJobList"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "${OPPORTUNITY}"
    direction: DOWN
    timeout: 20000
# Only a not-yet-accepted opportunity offers "View Opportunity"; btn_start
# ("Start") is what accepts it.
- runFlow:
    when:
      visible:
        id: "btn_view_opportunity"
    commands:
      - tapOn:
          id: "btn_view_opportunity"
      - assertVisible:
          id: "btn_start"
      - tapOn:
          id: "btn_start"
      - tapOn:
          text: "OK"
          optional: true
# The card's title is not clickable - its buttons are. With learning already
# finished the card offers Resume, which downloads the app on a fresh install and
# then opens its home screen. Allow a long timeout: this is a real download.
- tapOn:
    id: "btn_resume"
- extendedWaitUntil:
    visible:
      text: "Sync with Server"
    timeout: 600000

# --- The pending-task warning must be showing (TC-E2E-006, first half) ---
# cv_relearn_tasks_pending is on the deliver app's home job tile as well as the
# Connect delivery-progress card, so it can be checked here without going back.
- extendedWaitUntil:
    visible:
      text: ".*${PENDING_WARNING}.*"
    timeout: 120000

# Sync so the case property set at assignment arrives and unhides the form.
- tapOn: "Sync with Server"
- extendedWaitUntil:
    visible:
      text: ".*Sync Successful.*"
    timeout: 180000

# --- Complete the re-learn task form ---
- tapOn: "Start"
- tapOn: "${TASK_MODULE}"
- scrollUntilVisible:
    element:
      text: "${TASK_FORM}"
    direction: DOWN
    timeout: 20000
- tapOn: "${TASK_FORM}"

# First question is a "Name" text input, the second is a label-only note.
- extendedWaitUntil:
    visible:
      text: "Name"
    timeout: 60000
# Form widgets are built at runtime and carry no resource ids, so the answer
# field is reached by tapping just under the question label. A relative "below"
# selector would read better but is not proven on this Maestro version.
- tapOn:
    point: "50%,32%"
- inputText: "${TASK_NAME_ANSWER}"
# Advance with the next arrow (nav_btn_next, top right) until the end-of-form
# screen appears - FINISH is not offered while a question is still showing. The
# taps are optional so this copes with however many pages the form has.
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "nav_btn_next"
          optional: true
# The last next arrow completes the form outright, so FINISH is usually never
# shown as a step of its own - hence optional rather than awaited.
- tapOn:
    id: "nav_btn_finish"
    optional: true

# Back on the app home screen means the form closed, and CommCare submits it
# immediately when online - the Sync tile reports that.
- extendedWaitUntil:
    visible:
      text: "Sync with Server"
    timeout: 120000
- assertVisible:
    text: ".*form sent to server.*"

# Sync again so nothing stays queued.
- tapOn: "Sync with Server"
- extendedWaitUntil:
    visible:
      text: ".*Sync Successful.*|.*form sent to server.*"
    timeout: 180000

# --- The warning must be gone, replaced by the success message (TC-E2E-006) ---
# The pending flag lives in local prefs and only clears when the app refetches
# delivery progress from Connect. Opening the screen is not enough - the card
# carries its own "Click to sync progress" button (btnSync) and that is what
# pulls the updated task state down.
#
# Staging is slow to process a submission - on production this is close to
# instant, but here it can take minutes before Connect reports the task as
# complete. A single sync would just fetch stale state, so keep syncing while
# the warning is still up (bounded, so a genuine failure still ends the run).
- tapOn: "View Job Status"
- extendedWaitUntil:
    visible:
      id: "btnSync"
    timeout: 90000
- tapOn:
    id: "btnSync"
# One sync then a long wait, deliberately - NOT a retry loop. Inside a Maestro
# repeat, a failed command aborts the whole loop, so a loop of
# sync-then-short-wait fails on the first round instead of syncing again, which
# is strictly worse than simply waiting. This 5 minute wait is the version that
# passed end to end on 2026-08-03; revisit only with a construct that can
# swallow the intermediate failure.
- extendedWaitUntil:
    notVisible:
      text: ".*${PENDING_WARNING}.*"
    timeout: 300000
# Checked straight after completion, while inside the six-hour window in which
# ConnectJobRecord surfaces this message.
- extendedWaitUntil:
    visible:
      text: ".*${COMPLETED_MESSAGE}.*"
    timeout: 120000
