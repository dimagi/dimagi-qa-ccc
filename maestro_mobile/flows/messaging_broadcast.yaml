# Worker side of the hybrid broadcast test (TC-BRD-002, and TC-CHN-002 in passing).
#
# Web sends a Connect Message broadcast, this flow has the worker open the
# channel on a real device and assert the exact body arrives.
#
# A BrowserStack session always starts from a fresh install, so this runs the
# whole cold start: PersonalID sign-in, then straight to Messaging. Unlike the
# tasking flow it never touches Opportunities or the deliver app - a broadcast
# needs no delivery, only a PersonalID user with a channel.
#
# Ids come from commcare-android:
#   backup_code_view / welcome_back / connect_backup_code_button
#       fragment_recovery_code.xml - 2.63 replaced the single backup-code field
#       with a six-box NumericCodeView, so the code is typed into the focused view.
#   nav_drawer_recycler   the drawer PersonalIdManager.completeSignin() opens
#   "Messaging"           connect_messaging_title, always present once PersonalID
#                         is signed in (no feature flag)
#   "Channels"            connect_messaging_channel_list_title
#   tvChannelName         item_channel.xml. The click handler is on itemRootLayout,
#                         not the label, but a tap on the label bubbles to it.
#   etMessage / rvChat / tvChatMessage   fragment_connect_message.xml
# Ids are bare so the flow also matches debug builds, which suffix the applicationId.
appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "7426121"
  USERNAME: "CCC- Automationuser1"
  BACKUP_CODE: "123123"
  # The channel is named after the HQ domain (channel_source / META_CHANNEL_NAME),
  # so it differs per environment. Injected by the runner.
  CHANNEL_NAME: "connectqa-automation-prod"
  # The exact broadcast body the web half generated. Injected per run so this
  # asserts on the message this run sent, not on "some message arrived".
  EXPECTED_MESSAGE: "Test Connect Message Broadcast"
---
# permissions/all: Android 13 gates POST_NOTIFICATIONS behind a runtime grant and
# a cleared state re-asks for it. Messages arrive by FCM, so without it the
# delivery path under test is disabled.
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: shared_login_signup.yaml

# An existing PersonalID user lands on "Welcome back <name>" and authenticates
# with a backup code; a brand new number skips straight past this.
# Wait for the backup-code screen before testing for it. Maestro's runFlow
# `when` is a POINT-IN-TIME check, not a wait: tapping CONTINUE on the phone
# step starts a server round trip, and this condition used to be evaluated
# milliseconds later, before "Confirm Backup Code" had rendered. The whole block
# was then skipped and the flow walked on to later steps while still sitting on
# the code screen - failing several steps afterwards on an element that never
# had a chance (prod build 81f3043b, where the screenshot shows the code field
# empty and the keyboard still up).
#
# Safe as an unconditional wait because every flow reaching here signs in as an
# established account, which always gets this screen. The signup flow, which may
# not, does not use this block.
- extendedWaitUntil:
    visible:
      id: "backup_code_view"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "backup_code_view"
    commands:
      - assertVisible:
          id: "welcome_back"
      - inputText: "${BACKUP_CODE}"
      - tapOn:
          id: "connect_backup_code_button"
      # The "Account Recovered" dialog lands a moment AFTER the code is
      # accepted, so a single optional tap can run before it exists, warn, and
      # leave the modal sitting over every later tap. Staging build 7712d963
      # failed that way: the screenshot shows the dialog still up, and the flow
      # failing several steps later on a tap that never had a chance.
      #
      # Guarded on the dialog actually being present, and repeated so whichever
      # attempt runs after it appears is the one that dismisses it. Cheap when
      # the dialog never shows, which is the common case.
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  visible:
                    text: ".*Account Recovered.*"
                commands:
                  - tapOn:
                      text: "OKAY|OK"
            - waitForAnimationToEnd:
                timeout: 2500
      - assertNotVisible:
          id: "connect_backup_code_error_message"

# completeSignin() opens the drawer itself, so it is usually already showing.
# Open it only if it is not - tapping the hamburger while it is open closes it.
- runFlow:
    when:
      notVisible:
        id: "nav_drawer_recycler"
    commands:
      - tapOn:
          text: "Open navigation drawer"
      - extendedWaitUntil:
          visible:
            id: "nav_drawer_recycler"
          timeout: 15000

# --- TC-MSG-004: the drawer carries an unread badge ---
# The broadcast was sent before this build started, so it arrives on the first
# sync and is unviewed - which is the only state in which the badge exists. It
# is rendered by NavDrawerAdapter.bindBadgeCount into tv_message_count inside
# badge_layout, NOT in nav_drawer_item_view.xml, which is where one would look
# first and find nothing.
#
# Presence, not a number: bindBadgeCount renders anything above 9 as "9+", so
# asserting a count would be wrong the moment the channel has ten unread.
- extendedWaitUntil:
    visible:
      id: "tv_message_count"
    timeout: 120000

# --- Open Messaging ---
- tapOn:
    text: "Messaging"
- extendedWaitUntil:
    visible:
      text: "Channels"
    timeout: 60000

# The channel is created server-side by HQ's consent request and synced on first
# launch, so a missing channel here means the sync failed rather than the test
# being wrong - assert it explicitly before tapping.
- extendedWaitUntil:
    visible:
      text: "${CHANNEL_NAME}"
    timeout: 120000

# --- TC-MSG-003: the channel row shows an unread count ---
# This is the one moment the count exists: the broadcast was sent before the
# build started, so it arrives during the first sync and is unviewed until the
# thread is opened. Asserted here rather than in a mobile-only flow, which would
# have to manufacture the same moment.
- extendedWaitUntil:
    visible:
      id: "tvUnreadCount"
    timeout: 120000

# --- TC-CHN-004: the row carries its metadata, not just a name ---
# item_channel.xml renders the last-message preview and its timestamp beside the
# name. Asserted here because a broadcast has just arrived, so a preview must
# exist; on a channel that has never received anything there would be nothing to
# show and the assertion would be vacuous.
- assertVisible:
    id: "tvChannelDescription"
- assertVisible:
    id: "tvLastChatTime"

- tapOn:
    text: "${CHANNEL_NAME}"

# --- TC-CHN-007: the thread is titled with the channel name ---
# The list is gone once the thread opens, so the channel name still being on
# screen is the toolbar title (ConnectMessagingActivity sets it on open).
- extendedWaitUntil:
    visible:
      text: "${CHANNEL_NAME}"
    timeout: 30000

# The thread is open once the composer is there. etMessage doubles as the
# "not subscribed" banner, so its presence also proves the channel is consented.
- extendedWaitUntil:
    visible:
      id: "etMessage"
    timeout: 60000

# --- The broadcast must arrive ---
# It travels HQ -> ConnectID -> FCM -> device, and the open thread also re-polls
# every 30s (ConnectMessageFragment INTERVAL), so allow well past one poll.
# Substring match: Maestro's text selector is a full match unless wrapped.
- extendedWaitUntil:
    visible:
      text: ".*${EXPECTED_MESSAGE}.*"
    timeout: 420000
# A message with no timestamp would mean a half-rendered bubble.
- assertVisible:
    id: "tvChatDate"

# --- TC-MSG-005: opening the thread clears the unread state ---
# Opening a channel marks its messages userViewed=true, so going back to the
# list the count must be gone. Nothing has been typed in this flow, so a single
# Back navigates (unlike messaging_consent.yaml, where the composer holds focus
# and the first Back only dismisses the keyboard).
- back
- extendedWaitUntil:
    visible:
      text: "Channels"
    timeout: 30000
- assertNotVisible:
    id: "tvUnreadCount"
