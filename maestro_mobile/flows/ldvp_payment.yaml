# LDVP payment session (CCCT-2670), after Connect auto-approved V1, its copy and V2 and web
# paid the earned amount. Covers the device halves of TC-VER-001/003, TC-PAY-001
# and TC-PAY-002.
#
# Ids and strings are from commcare-android at tag commcare_2.65.0
# (fragment_connect_delivery_home.xml, ConnectDeliveryPaymentFragment): the
# delivery home has tabs Dashboard / Payment / Visits / More
# (connect_delivery_home_tabs). The Payment tab shows payment_earned_amount and
# payment_transferred_amount over one row per payment. An unconfirmed row reads
# "Transferred" (tv_payment_status) and shows a `confirm` control, which opens a
# "Confirm Transferred Payment" dialog (tv_payment_amount, ri_yes / ri_no); a
# confirmed row reads "Received" and hides `confirm`. 2.65 has no "Ask me
# later" card - confirmation is per row.
appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "7426091"
  USERNAME: "QA LDVP Worker"
  BACKUP_CODE: "609100"
  OPPORTUNITY: "Demo Opportunity"
  APPROVED: "3"
  EARNED: "300"
  TRANSFERRED: "300"
  # "false" only when a run resumes at this session: see TC-PAY-001 below.
  CHECK_PAYMENT_PUSH: "true"
---
- runFlow: shared_ldvp_signin.yaml
- runFlow: shared_ldvp_job_list.yaml

# --- TC-PAY-001: the payment notification in the app's notification history ---
# Web acted before this session started (a Maestro build cannot pause for it),
# so the push went out before this fresh install signed in and never reaches its
# shade. The server hands a not-yet-delivered notification to the next sign-in's
# history, and only once: a re-run of this session finds the list empty
# (prod 2026-11-02), so a resumed run skips the check.
- runFlow:
    when:
      true: ${CHECK_PAYMENT_PUSH == 'true'}
    commands:
      - tapOn:
          id: "action_bell"
      - extendedWaitUntil:
          visible:
            # The history list shows the push's body only, not its "Payment
            # received" title (seen on prod 2026-11-02).
            text: "(?s).*(A payment is now available|Payment received).*"
          timeout: 120000
      - back
- extendedWaitUntil:
    visible:
      id: "rvJobList"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "${OPPORTUNITY}"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "${OPPORTUNITY}"
- extendedWaitUntil:
    visible:
      id: "connect_delivery_home_tabs"
    timeout: 30000

# --- TC-VER-001: the approved visits ---
# V1, its copy and V2 were auto-approved (an auto-verified opportunity cannot
# flag duplicates); had the over-limit V3 been counted, the approved count or
# the earned amount would be higher.
- tapOn:
    text: "Visits"
    childOf:
      id: "connect_delivery_home_tabs"
- extendedWaitUntil:
    visible:
      id: "tvApproved"
    timeout: 30000
- assertVisible:
    id: "tvApproved"
    text: "(?s)\\D*${APPROVED}\\b.*"

# --- TC-VER-003 / TC-PAY-001: earned, transferred, and an unconfirmed payment ---
- tapOn:
    text: "Payment"
    childOf:
      id: "connect_delivery_home_tabs"
- extendedWaitUntil:
    visible:
      id: "payment_transferred_amount"
    timeout: 30000
- assertVisible:
    id: "payment_earned_amount"
    text: "(?s).*\\b${EARNED}\\b.*"
- assertVisible:
    id: "payment_transferred_amount"
    text: "(?s).*\\b${TRANSFERRED}\\b.*"
- assertVisible:
    id: "tv_payment_status"
    text: "Transferred"
- assertVisible:
    id: "confirm"

# --- TC-PAY-002 (device half): confirm receipt; web checks the rest ---
- tapOn:
    id: "confirm"
- extendedWaitUntil:
    visible:
      id: "tv_payment_confirmation_title"
    timeout: 15000
- assertVisible:
    id: "tv_payment_amount"
    text: "(?s).*\\b${TRANSFERRED}\\b.*"
- tapOn:
    id: "ri_yes"
- extendedWaitUntil:
    visible:
      id: "tv_payment_status"
      text: "Received"
    timeout: 60000
- assertNotVisible:
    id: "confirm"
