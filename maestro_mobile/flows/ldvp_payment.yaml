# LDVP payment session (CCCT-2670), after web approved V1, rejected V2 and paid
# the earned amount. Covers the device halves of TC-VER-001/002/003, TC-PAY-001
# and TC-PAY-002.
#
# Ids and strings are from commcare-android at tag commcare_2.65.0
# (fragment_connect_delivery_home.xml, ConnectDeliveryPaymentFragment): the
# delivery home has tabs Dashboard / Payment / Visits / More
# (connect_delivery_home_tabs). The Payment tab shows payment_earned_amount and
# payment_transferred_amount over one row per payment. An unconfirmed row reads
# "Transferred" (tv_payment_status) and shows a `confirm` control, which opens a
# "Confirm Transferred Payment" dialog (tv_payment_amount, ri_yes / ri_no); a
# confirmed row reads "Received" and hides `confirm`. 2.65 has no "Ask me
# later" card - confirmation is per row.
appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "7426091"
  USERNAME: "QA LDVP Worker"
  BACKUP_CODE: "609100"
  OPPORTUNITY: "Demo Opportunity"
  VISIT_NAME_V2: "LDVP-V2-000000"
  EARNED: "100"
  TRANSFERRED: "100"
---
- runFlow: shared_ldvp_signin.yaml
- runFlow: shared_ldvp_job_list.yaml

# --- TC-PAY-001: the payment notification in the app's notification history ---
# Web acted before this session started (a Maestro build cannot pause for it),
# so the push went out before this fresh install signed in and never reaches its
# shade. The notification history is kept server side and lists it.
- tapOn:
    id: "action_bell"
- extendedWaitUntil:
    visible:
      text: "(?s).*(Payment received|You have received a payment).*"
    timeout: 120000
- back
- extendedWaitUntil:
    visible:
      id: "rvJobList"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "${OPPORTUNITY}"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "${OPPORTUNITY}"
- extendedWaitUntil:
    visible:
      id: "connect_delivery_home_tabs"
    timeout: 30000

# --- TC-VER-001: one approved visit ---
# The rejected V2, the duplicate and the over-limit V3 would each have pushed the
# approved count or the earned amount up, so 1 approved and 100 earned together
# are what discriminate.
- tapOn:
    text: "Visits"
    childOf:
      id: "connect_delivery_home_tabs"
- extendedWaitUntil:
    visible:
      id: "tvApproved"
    timeout: 30000
- assertVisible:
    id: "tvApproved"
    text: "(?s)\\D*1\\b.*"

# --- TC-VER-002: the rejected visit says so ---
# Only V2 was rejected (V1 approved, its copy duplicate, V3 over limit), so a
# rejected status on the list belongs to it.
- tapOn:
    id: "imgArrowForward"
- extendedWaitUntil:
    visible:
      id: "delivery_list"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "delivery_item_name"
      text: ".*${VISIT_NAME_V2}.*"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "delivery_item_status"
    text: "(?i).*(reject|not approved).*"
- back

# --- TC-VER-003 / TC-PAY-001: earned, transferred, and an unconfirmed payment ---
- tapOn:
    text: "Payment"
    childOf:
      id: "connect_delivery_home_tabs"
- extendedWaitUntil:
    visible:
      id: "payment_transferred_amount"
    timeout: 30000
- assertVisible:
    id: "payment_earned_amount"
    text: "(?s).*\\b${EARNED}\\b.*"
- assertVisible:
    id: "payment_transferred_amount"
    text: "(?s).*\\b${TRANSFERRED}\\b.*"
- assertVisible:
    id: "tv_payment_status"
    text: "Transferred"
- assertVisible:
    id: "confirm"

# --- TC-PAY-002 (device half): confirm receipt; web checks the rest ---
- tapOn:
    id: "confirm"
- extendedWaitUntil:
    visible:
      id: "tv_payment_confirmation_title"
    timeout: 15000
- assertVisible:
    id: "tv_payment_amount"
    text: "(?s).*\\b${TRANSFERRED}\\b.*"
- tapOn:
    id: "ri_yes"
- extendedWaitUntil:
    visible:
      id: "tv_payment_status"
      text: "Received"
    timeout: 60000
- assertNotVisible:
    id: "confirm"
