# Consent gates delivery, second half (TC-SUB-004, TC-SUB-006).
#
# Runs AFTER messaging_unsubscribe_only.yaml has left the channel unsubscribed
# and after the web half has sent MESSAGE_BLOCKED into it. Consent is
# server-side state, so it survives the reinstall between builds.
#
# Split into two builds on purpose. The single-build version tried to wait out
# the blocked send between unsubscribing and resubscribing, but the wait was
# extendedWaitUntil on an already-visible element and returned instantly - the
# device resubscribed a minute before the message was sent, so it was delivered
# to a consented channel and the test proved nothing. Two builds make the
# ordering a fact rather than a hope.
#
# The pair has to be judged together: TC-SUB-004 alone would still pass if
# delivery were broken permanently. So the blocked message is checked for
# absence only AFTER the allowed one has arrived, at which point the channel is
# provably live.
#
# Leaves the channel subscribed.
appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "7426121"
  USERNAME: "CCC- Automationuser1"
  BACKUP_CODE: "123123"
  CHANNEL_NAME: "connectqa-automation-prod"
  MESSAGE_BLOCKED: "Blocked while unsubscribed"
  MESSAGE_ALLOWED: "Allowed after resubscribe"
  NOT_SUBSCRIBED_TEXT: "You are not subscribed to this messaging channel"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: shared_login_signup.yaml

# The backup-code screen, and the optional email step 2.64 added after it.
- runFlow: shared_backup_code.yaml

- runFlow:
    when:
      notVisible:
        id: "nav_drawer_recycler"
    commands:
      - tapOn:
          text: "Open navigation drawer"
      - extendedWaitUntil:
          visible:
            id: "nav_drawer_recycler"
          timeout: 15000

# Open Messaging from the drawer, and retry until the Channels screen is really
# there.
#
# The drawer is opened by completeSignin() and slides in. Tapping a row while
# that animation is still running is accepted by Maestro - the row's final
# bounds are already in the view hierarchy, and the ripple registers as
# "Something have changed in the UI judging by view hierarchy" - but
# DrawerLayout swallows the touch. The tap reports COMPLETED and nothing
# navigates.
#
# Prod build 2b090dc6 is exactly that: "Tap on Messaging COMPLETED" at 16:41:06,
# the Channels assertion failing 60s later, and the failure screenshot still
# showing the drawer wide open over the home screen. Same shape as the
# notification banner and the backup-code guard - a step that succeeds while
# doing nothing.
#
# That one swallowed tap was expensive out of proportion to itself: it stranded
# a half-answered survey on the channel, and the next two tests sent their
# keywords into that open survey instead of to keyword processing. See the note
# on the keyword flows.
#
# So settle first, then retry the tap while Channels is still absent. The tap is
# optional because a swallowed tap reports success anyway and therefore cannot
# be the thing that decides this worked; the wait after the loop is.
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
              text: "Channels"
          commands:
            - tapOn:
                text: "Messaging"
                optional: true
            - waitForAnimationToEnd:
                timeout: 5000
- extendedWaitUntil:
    visible:
      text: "Channels"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "${CHANNEL_NAME}"
    timeout: 120000
- tapOn:
    text: "${CHANNEL_NAME}"
- extendedWaitUntil:
    visible:
      id: "etMessage"
    timeout: 60000

# --- TC-SUB-004: the blocked message must NOT be here ---
# The channel is still unsubscribed from the previous build, and the web half
# already sent MESSAGE_BLOCKED into it. Checked before resubscribing, so this is
# the state a genuinely unsubscribed worker sees.
- assertNotVisible:
    text: ".*${MESSAGE_BLOCKED}.*"
- assertVisible:
    text: ".*${NOT_SUBSCRIBED_TEXT}.*"

# --- Resubscribe ---
- tapOn:
    text: "More options"
- tapOn:
    text: "Resubscribe"
- tapOn:
    text: "Resubscribe"
- runFlow: shared_consent_settled.yaml
- extendedWaitUntil:
    notVisible:
      text: ".*${NOT_SUBSCRIBED_TEXT}.*"
    timeout: 30000

# --- TC-SUB-006: delivery resumes ---
- extendedWaitUntil:
    visible:
      text: ".*${MESSAGE_ALLOWED}.*"
    timeout: 420000

# --- The pair's real assertion ---
# The channel is provably live (the allowed message just arrived), so the
# blocked message being absent means it was never delivered, not that it was
# slow.
- assertNotVisible:
    text: ".*${MESSAGE_BLOCKED}.*"
