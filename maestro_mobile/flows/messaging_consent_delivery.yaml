# Consent gates delivery, second half (TC-SUB-004, TC-SUB-006).
#
# Runs AFTER messaging_unsubscribe_only.yaml has left the channel unsubscribed
# and after the web half has sent MESSAGE_BLOCKED into it. Consent is
# server-side state, so it survives the reinstall between builds.
#
# Split into two builds on purpose. The single-build version tried to wait out
# the blocked send between unsubscribing and resubscribing, but the wait was
# extendedWaitUntil on an already-visible element and returned instantly - the
# device resubscribed a minute before the message was sent, so it was delivered
# to a consented channel and the test proved nothing. Two builds make the
# ordering a fact rather than a hope.
#
# The pair has to be judged together: TC-SUB-004 alone would still pass if
# delivery were broken permanently. So the blocked message is checked for
# absence only AFTER the allowed one has arrived, at which point the channel is
# provably live.
#
# Leaves the channel subscribed.
appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "7426121"
  USERNAME: "CCC- Automationuser1"
  BACKUP_CODE: "123123"
  CHANNEL_NAME: "connectqa-automation-prod"
  MESSAGE_BLOCKED: "Blocked while unsubscribed"
  MESSAGE_ALLOWED: "Allowed after resubscribe"
  NOT_SUBSCRIBED_TEXT: "You are not subscribed to this messaging channel"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: shared_login_signup.yaml

# Wait for the backup-code screen before testing for it. Maestro's runFlow
# `when` is a POINT-IN-TIME check, not a wait: tapping CONTINUE on the phone
# step starts a server round trip, and this condition used to be evaluated
# milliseconds later, before "Confirm Backup Code" had rendered. The whole block
# was then skipped and the flow walked on to later steps while still sitting on
# the code screen - failing several steps afterwards on an element that never
# had a chance (prod build 81f3043b, where the screenshot shows the code field
# empty and the keyboard still up).
#
# Safe as an unconditional wait because every flow reaching here signs in as an
# established account, which always gets this screen. The signup flow, which may
# not, does not use this block.
- extendedWaitUntil:
    visible:
      id: "backup_code_view"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "backup_code_view"
    commands:
      - assertVisible:
          id: "welcome_back"
      - inputText: "${BACKUP_CODE}"
      - tapOn:
          id: "connect_backup_code_button"
      # The "Account Recovered" dialog lands a moment AFTER the code is
      # accepted, so a single optional tap can run before it exists, warn, and
      # leave the modal sitting over every later tap. Staging build 7712d963
      # failed that way: the screenshot shows the dialog still up, and the flow
      # failing several steps later on a tap that never had a chance.
      #
      # Guarded on the dialog actually being present, and repeated so whichever
      # attempt runs after it appears is the one that dismisses it. Cheap when
      # the dialog never shows, which is the common case.
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  visible:
                    text: ".*Account Recovered.*"
                commands:
                  - tapOn:
                      text: "OKAY|OK"
            - waitForAnimationToEnd:
                timeout: 2500
      - assertNotVisible:
          id: "connect_backup_code_error_message"

- runFlow:
    when:
      notVisible:
        id: "nav_drawer_recycler"
    commands:
      - tapOn:
          text: "Open navigation drawer"
      - extendedWaitUntil:
          visible:
            id: "nav_drawer_recycler"
          timeout: 15000

- tapOn:
    text: "Messaging"
- extendedWaitUntil:
    visible:
      text: "Channels"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "${CHANNEL_NAME}"
    timeout: 120000
- tapOn:
    text: "${CHANNEL_NAME}"
- extendedWaitUntil:
    visible:
      id: "etMessage"
    timeout: 60000

# --- TC-SUB-004: the blocked message must NOT be here ---
# The channel is still unsubscribed from the previous build, and the web half
# already sent MESSAGE_BLOCKED into it. Checked before resubscribing, so this is
# the state a genuinely unsubscribed worker sees.
- assertNotVisible:
    text: ".*${MESSAGE_BLOCKED}.*"
- assertVisible:
    text: ".*${NOT_SUBSCRIBED_TEXT}.*"

# --- Resubscribe ---
- tapOn:
    text: "More options"
- tapOn:
    text: "Resubscribe"
- tapOn:
    text: "Resubscribe"
- extendedWaitUntil:
    notVisible:
      text: ".*${NOT_SUBSCRIBED_TEXT}.*"
    timeout: 30000

# --- TC-SUB-006: delivery resumes ---
- extendedWaitUntil:
    visible:
      text: ".*${MESSAGE_ALLOWED}.*"
    timeout: 420000

# --- The pair's real assertion ---
# The channel is provably live (the allowed message just arrived), so the
# blocked message being absent means it was never delivered, not that it was
# slow.
- assertNotVisible:
    text: ".*${MESSAGE_BLOCKED}.*"
