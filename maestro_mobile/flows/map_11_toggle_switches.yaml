# Map_11 - the polygon and geopoint toggles can be switched ON/OFF. This asserts
# the toggle STATE via the switch's `checked` trait, which is the deterministic,
# automatable part. The RENDERING effect on the map (the boundary/point actually
# showing or hiding) is drawn on the Google Map canvas with no accessibility
# nodes, so that half of Map_11 stays a manual check.
#
# Toggle ids verified live 2026-08-18: tapping toggle_polygons flips its switch
# state while the others are unchanged. State is read from the switch's `checked`
# accessibility trait rather than a "<layer> ON"/"<layer> OFF" label, because the
# label is app-content driven (getToggleLabel() returns the case-list detail's
# header when set, else the bare layer name) and carries no state at all. The
# text form matched the pre-2.64 build these flows were written against and
# stopped matching on 2.64.
appId: org.commcare.dalvik
---
- runFlow: shared_map_open.yaml

# All three start ON.
- assertVisible: { id: "org.commcare.dalvik:id/toggle_markers", checked: true }
- assertVisible: { id: "org.commcare.dalvik:id/toggle_polygons", checked: true }
- assertVisible: { id: "org.commcare.dalvik:id/toggle_geopoints", checked: true }

# Turn polygons OFF (geopoints/markers stay ON).
- tapOn: { id: "org.commcare.dalvik:id/toggle_polygons" }
- assertVisible: { id: "org.commcare.dalvik:id/toggle_polygons", checked: false }
- assertVisible: { id: "org.commcare.dalvik:id/toggle_geopoints", checked: true }

# Turn geopoints OFF too (both boundary and points now off).
- tapOn: { id: "org.commcare.dalvik:id/toggle_geopoints" }
- assertVisible: { id: "org.commcare.dalvik:id/toggle_geopoints", checked: false }
- assertVisible: { id: "org.commcare.dalvik:id/toggle_polygons", checked: false }

# Turn polygons back ON (points off, boundary on) - the reverse combination.
- tapOn: { id: "org.commcare.dalvik:id/toggle_polygons" }
- assertVisible: { id: "org.commcare.dalvik:id/toggle_polygons", checked: true }
- assertVisible: { id: "org.commcare.dalvik:id/toggle_geopoints", checked: false }

# Restore both to ON so the switch state is left as it was found.
- tapOn: { id: "org.commcare.dalvik:id/toggle_geopoints" }
- assertVisible: { id: "org.commcare.dalvik:id/toggle_geopoints", checked: true }
- assertVisible: { id: "org.commcare.dalvik:id/toggle_polygons", checked: true }
