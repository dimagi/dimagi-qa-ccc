appId: org.commcare.dalvik
---
- tapOn:
    text: "Open navigation drawer"
- assertVisible:
    text: "About CommCare"
- tapOn:
    id: "org.commcare.dalvik:id/nav_drawer_sign_in_button"
- assertVisible:
    id: "org.commcare.dalvik:id/connect_primary_phone_input"
- tapOn:
    id: "org.commcare.dalvik:id/countryCode"
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    id: "org.commcare.dalvik:id/countryCode"
- eraseText
- inputText: "${COUNTRY_CODE}"
- tapOn:
    id: "org.commcare.dalvik:id/connect_primary_phone_input"
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    id: "org.commcare.dalvik:id/connect_primary_phone_input"
- inputText: "${PHONE_NUMBER}"
- tapOn:
    id: "org.commcare.dalvik:id/connect_consent_check"
# Wait for CONTINUE to actually become enabled rather than tapping straight
# after the checkbox. The button is gated on the form re-validating, which lags
# the tap, and Maestro will happily "tap" a disabled button: its hierarchy-based
# tap only checks that *something* changed on screen afterwards, and a 0.5%
# screenshot diff counts. The result is a tap that does nothing, followed by a
# confusing failure on the next screen's element. Observed intermittently - the
# same flow passed minutes earlier - so it is a race, not a broken selector.
# 90s, not 20s. The button is not merely waiting on local form validation - the
# app checks the number server-side before enabling it, so this is a network
# round trip and 20s lost the race on prod while passing minutes earlier on the
# same flow. The failure screenshot showed a correct number, a ticked consent
# box and a still-greyed CONTINUE, which rules out the autofill-stealing-
# keystrokes theory. Third too-short wait found in this shared preamble; the
# wait costs nothing when the server is quick.
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/personalid_phone_continue_button"
      enabled: true
    timeout: 90000
- tapOn:
    id: "org.commcare.dalvik:id/personalid_phone_continue_button"
# The phone-number step round-trips to the Connect server, which is markedly
# slower on staging than prod: 15s was enough on prod and passed on staging by
# luck, then failed there with the spinner still up. The wait costs nothing when
# the server is quick, so give it room rather than trading flakiness for speed.
- extendedWaitUntil:
    notVisible:
      id: "org.commcare.dalvik:id/progress_bar"
    timeout: 90000
# The name screen can lag behind the progress bar clearing on a slow (e.g.
# BrowserStack) device - wait for the field before tapping so the flow doesn't
# flake on a not-yet-rendered nameTextValue.
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nameTextValue"
    timeout: 20000
- tapOn:
    id: "org.commcare.dalvik:id/nameTextValue"
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    id: "org.commcare.dalvik:id/nameTextValue"
- inputText: "${USERNAME}"
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "CONTINUE"
