# Channel list empty state (TC-CHN-003).
#
# A worker who belongs to no messaging channels must be told so, rather than
# shown a blank screen. Legacy's verify_channel_list() accepted empty OR
# populated, so it never pinned either state.
#
# Runs as MAESTRO_MESSAGING_EMPTY_STATE, which must be an account in no
# channels. Do NOT point it at the hybrid worker: that one has a channel now,
# so the assertion could never pass again.
#
# Doubles as the cheapest way to find out whether a given account has a channel
# yet: it passes only if the account is in none. Run against a worker you
# believe is unsubscribed from everything, and a failure means it already has
# one - which for a fresh account also means the one-shot "New Channel" push of
# TC-CHN-001a has already fired and cannot be observed again.
#
# From commcare-android fragment_channel_list.xml:
#   tv_no_channel_msg  the empty-state label
#   rvChannel          the channel RecyclerView
#   "Channels"         connect_messaging_channel_list_title
appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "4376447"
  USERNAME: "No Channel User (Prod)"
  BACKUP_CODE: "123456"
  EMPTY_TEXT: "You're not subscribed to any messaging channels"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: shared_login_signup.yaml

# The backup-code screen, and the optional email step 2.64 added after it.
- runFlow: shared_backup_code.yaml

- runFlow:
    when:
      notVisible:
        id: "nav_drawer_recycler"
    commands:
      - tapOn:
          text: "Open navigation drawer"
      - extendedWaitUntil:
          visible:
            id: "nav_drawer_recycler"
          timeout: 15000

# Open Messaging from the drawer, and retry until the Channels screen is really
# there.
#
# The drawer is opened by completeSignin() and slides in. Tapping a row while
# that animation is still running is accepted by Maestro - the row's final
# bounds are already in the view hierarchy, and the ripple registers as
# "Something have changed in the UI judging by view hierarchy" - but
# DrawerLayout swallows the touch. The tap reports COMPLETED and nothing
# navigates.
#
# Prod build 2b090dc6 is exactly that: "Tap on Messaging COMPLETED" at 16:41:06,
# the Channels assertion failing 60s later, and the failure screenshot still
# showing the drawer wide open over the home screen. Same shape as the
# notification banner and the backup-code guard - a step that succeeds while
# doing nothing.
#
# That one swallowed tap was expensive out of proportion to itself: it stranded
# a half-answered survey on the channel, and the next two tests sent their
# keywords into that open survey instead of to keyword processing. See the note
# on the keyword flows.
#
# So settle first, then retry the tap while Channels is still absent. The tap is
# optional because a swallowed tap reports success anyway and therefore cannot
# be the thing that decides this worked; the wait after the loop is.
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
              text: "Channels"
          commands:
            - tapOn:
                text: "Messaging"
                optional: true
            - waitForAnimationToEnd:
                timeout: 5000
- extendedWaitUntil:
    visible:
      text: "Channels"
    timeout: 60000

# Give the channel sync a chance to bring something down before concluding the
# list is empty - asserting immediately would pass on a slow sync rather than on
# a genuinely empty account.
- extendedWaitUntil:
    visible:
      text: ".*${EMPTY_TEXT}.*"
    timeout: 90000
