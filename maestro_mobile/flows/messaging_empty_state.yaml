# Channel list empty state (TC-CHN-003).
#
# A worker who belongs to no messaging channels must be told so, rather than
# shown a blank screen. Legacy's verify_channel_list() accepted empty OR
# populated, so it never pinned either state.
#
# Runs as MAESTRO_MESSAGING_EMPTY_STATE, which must be an account in no
# channels. Do NOT point it at the hybrid worker: that one has a channel now,
# so the assertion could never pass again.
#
# Doubles as the cheapest way to find out whether a given account has a channel
# yet: it passes only if the account is in none. Run against a worker you
# believe is unsubscribed from everything, and a failure means it already has
# one - which for a fresh account also means the one-shot "New Channel" push of
# TC-CHN-001a has already fired and cannot be observed again.
#
# From commcare-android fragment_channel_list.xml:
#   tv_no_channel_msg  the empty-state label
#   rvChannel          the channel RecyclerView
#   "Channels"         connect_messaging_channel_list_title
appId: org.commcare.dalvik
env:
  COUNTRY_CODE: "+7426"
  PHONE_NUMBER: "4376447"
  USERNAME: "No Channel User (Prod)"
  BACKUP_CODE: "123456"
  EMPTY_TEXT: "You're not subscribed to any messaging channels"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: shared_login_signup.yaml

# Wait for the backup-code screen before testing for it. Maestro's runFlow
# `when` is a POINT-IN-TIME check, not a wait: tapping CONTINUE on the phone
# step starts a server round trip, and this condition used to be evaluated
# milliseconds later, before "Confirm Backup Code" had rendered. The whole block
# was then skipped and the flow walked on to later steps while still sitting on
# the code screen - failing several steps afterwards on an element that never
# had a chance (prod build 81f3043b, where the screenshot shows the code field
# empty and the keyboard still up).
#
# Safe as an unconditional wait because every flow reaching here signs in as an
# established account, which always gets this screen. The signup flow, which may
# not, does not use this block.
- extendedWaitUntil:
    visible:
      id: "backup_code_view"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "backup_code_view"
    commands:
      - assertVisible:
          id: "welcome_back"
      - inputText: "${BACKUP_CODE}"
      - tapOn:
          id: "connect_backup_code_button"
      # The "Account Recovered" dialog lands a moment AFTER the code is
      # accepted, so a single optional tap can run before it exists, warn, and
      # leave the modal sitting over every later tap. Staging build 7712d963
      # failed that way: the screenshot shows the dialog still up, and the flow
      # failing several steps later on a tap that never had a chance.
      #
      # Guarded on the dialog actually being present, and repeated so whichever
      # attempt runs after it appears is the one that dismisses it. Cheap when
      # the dialog never shows, which is the common case.
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  visible:
                    text: ".*Account Recovered.*"
                commands:
                  - tapOn:
                      text: "OKAY|OK"
            - waitForAnimationToEnd:
                timeout: 2500
      - assertNotVisible:
          id: "connect_backup_code_error_message"

- runFlow:
    when:
      notVisible:
        id: "nav_drawer_recycler"
    commands:
      - tapOn:
          text: "Open navigation drawer"
      - extendedWaitUntil:
          visible:
            id: "nav_drawer_recycler"
          timeout: 15000

- tapOn:
    text: "Messaging"
- extendedWaitUntil:
    visible:
      text: "Channels"
    timeout: 60000

# Give the channel sync a chance to bring something down before concluding the
# list is empty - asserting immediately would pass on a slow sync rather than on
# a genuinely empty account.
- extendedWaitUntil:
    visible:
      text: ".*${EMPTY_TEXT}.*"
    timeout: 90000
