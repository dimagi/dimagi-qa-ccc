# Personal ID - Traditional App Install & Login (PID_48-55). One identity drives
# the whole link/unlink lifecycle: a PersonalId account signed into on the device,
# a traditional (non-Connect) app installed by code, and a mobile worker whose
# password login is offered for linking. The mobile worker credentials are
# secrets - the runner reads mw_username / mw_password from settings.cfg [mobile]
# (gitignored), not from here.
#
# The app install code is NOT stored (it is tied to one build and goes stale on
# every publish); the runner resolves it fresh from HQ at run time from the
# domain + app_id below via hq_client.get_app_install_code.
# Case List Map - shared by Map_10 and Map_11 (local run_tests.py path). The
# "Case_list" PersonalId worker has no mobile-worker password: the deliver app is
# opened through the Connect menu (see flows/shared_map_open.yaml), so no app_code
# is needed. Worker identity uses the suite's canonical keys; the CI path reads
# the same identity from test_data/mobile_workers.yaml (MAESTRO_MAP_CASE_LIST).
# The app-structure labels (opportunity/module/list) live as defaults in the flow.
MAP_CASE_LIST:
  country_code: "+7426"
  phone_number: "9870654"
  username: "Case_list"
  backup_code: "123456"

PID_TRADITIONAL_LINK:
  country_code: "+7426"
  pid_phone: "7426000"          # PersonalId phone (existing staging account)
  pid_name: "Deb Test 8/12"     # PersonalId account name
  pid_backup: "742600"          # PersonalId 6-digit backup code
  # Traditional app "[AV] Accessibility Test" on qateam (same domain as the worker).
  domain: "qateam"
  app_id: "7c98dfcad251eecdccc81012196a3cb5"
