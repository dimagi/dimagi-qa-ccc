[pytest]
addopts = -v -s --alluredir=reports/allure-results --html=report.html --self-contained-html --tb=short --capture=tee-sys
testpaths = tests
markers =
    smoke: smoke tests
    mobile: mobile app tests
    web: web app tests
    cleanup: cleanup for web app created by automated tests
    pending_prod(pr): updated or new test for a commcare-connect PR - runs only where
        that PR's code is deployed (see playwright_web/utils/pr_gating.py).
    replaced_by_pr(pr): original test an updated copy replaces - skipped once that
        commcare-connect PR's code is deployed (see playwright_web/utils/pr_gating.py).
    bugasura: test case ids in bugasura
