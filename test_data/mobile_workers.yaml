# --- Connect messaging (CCCT-2671) ---
#
# Which worker serves which case, so the mapping is not folklore:
#
#   MAESTRO_MESSAGING_HYBRID  -> the hybrid tests that need a channel and a
#                                delivery form. Used by:
#                                  TC-CAL-003 / TC-CAL-005  conditional alert
#                                    message + survey arriving in the channel
#                                    (ports legacy test_tc_09 / Messaging_2,3)
#                                  TC-BRD-002 / TC-BRD-003  broadcast message +
#                                    survey (ports legacy test_tc_10 /
#                                    Messaging_5,6)
#                                  TC-KWD-002 / TC-KWD-004  keyword-triggered
#                                    message + survey, sent from the channel
#                                  TC-MSG-003..006  unread counts, drawer badge,
#                                    push deep-link
#
# The worker must be enrolled and already delivering on an opportunity whose
# deliver app has a Registration Form - the conditional alert fires on that
# submission. It does NOT need a channel seeded: the first Connect Message
# creates one, and ConnectID's CreateChannelView is get_or_create, so the
# channel then persists and is reused by every later run.
#
# Environments deliberately use different numbers. A PersonalID number cannot
# hold a session on two environments at once, and stage and prod run on the same
# push, so a shared number means the two device sessions evict each other
# mid-flow.
MAESTRO_MESSAGING_HYBRID:
  # Prod: the worker legacy test_tc_09 already used (mobile_workers.yaml TC_9),
  # enrolled on opportunity "test_09". Its HQ user id is the alert recipient,
  # recorded as MESSAGING.alert_recipient_id in web_test_data.yaml.
  country_code: "+7426"
  phone_number: "7426121"
  username: "CCC- Automationuser1"
  backup_code: "123123"
  # Staging: created 2026-08-12 specifically for the messaging tests. Full number
  # is +74264678161 - "+7426" is the country code, so the subscriber part is
  # 4678161, matching the 7-digit shape of every other worker here.
  # Still to confirm on staging: which opportunity it is enrolled on, and its HQ
  # user id for MESSAGING.alert_recipient_id_staging.
  phone_number_staging: "4678161"
  username_staging: "Message Automation User"
  backup_code_staging: "123456"

# Deliberately subscribed to NO channels - the empty-state case asserts
# "You're not subscribed to any messaging channels".
#   MAESTRO_MESSAGING_EMPTY_STATE -> TC-CHN-003
#
# ###################################################################
# #  NEVER INVITE THESE TWO NUMBERS TO A CHANNEL OR AN OPPORTUNITY. #
# ###################################################################
#
# These accounts are reserved, and reserved is the whole point: TC-CHN-003 needs
# an account that has never been in ANY channel on ANY domain. A channel cannot
# be undone - ConnectID's CreateChannelView is get_or_create on (server,
# connect_user, channel_source), so once one exists it exists forever and
# unsubscribing does not remove it, it only flags the row. One consent request
# sent to either number therefore retires the case permanently and costs a fresh
# account to restore.
#
# That also means: do not point any other messaging test at these, and do not
# reach for them as a spare login when an account is misbehaving. They earn their
# keep by staying empty.
#
# Provided 2026-08-18 to replace the previous pair (prod 7426426 "Automation User
# 26", staging 7426000 "Deb Test 8/12"), which were no longer clean.
MAESTRO_MESSAGING_EMPTY_STATE:
  country_code: "+7426"
  phone_number: "4376447"
  username: "No Channel User (Prod)"
  backup_code: "123456"
  phone_number_staging: "4376448"
  username_staging: "No Channel User (Staging)"
  backup_code_staging: "123456"
