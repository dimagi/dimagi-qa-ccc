# --- PersonalID email + Manage Profile (CCCT-2784) ----------------------------
#
# These entries carry NO phone_number, and that is deliberate. Every flow below
# registers a brand-new account from a cleared app, so the number is generated at
# runtime by shared_registration.yaml ('129' + the clock's last four digits, in
# the reserved 129xxxx automation block). A fixed number would be wrong here: the
# second run would find the account already exists and silently exercise recovery
# instead of registration.
#
# Same reason there is no *_staging override: the account is created during the
# run, so it exists on whichever environment the run targets.
#
# Which worker serves which case:
#
#   MAESTRO_PROFILE_VIEW         -> MP_01-MP_04  reaching Manage Profile and the
#                                   Profile screen's contents
#   MAESTRO_PROFILE_EDIT_NAME    -> MP_05-MP_07  renaming, and the blank-name guard
#   MAESTRO_PROFILE_EDIT_EMAIL   -> MP_08-MP_13, MP_19  email validation, the
#                                   confirm prompt, and verification
#   MAESTRO_PROFILE_DISCARD      -> MP_14-MP_16  unsaved-changes warning
#   MAESTRO_PROFILE_FORGET       -> MP_17, MP_18  Forget PersonalID Account
#   MAESTRO_RECOVERY_EMAIL       -> RE_01, RE_02  the email step during recovery
#   MAESTRO_SIGNUP_EMAIL_ADD     -> SE_01-SE_05, SE_11  the email step during signup
#   MAESTRO_SIGNUP_EMAIL_VERIFY  -> SE_06-SE_10, SE_12  verifying the emailed code
#   MAESTRO_INTEGRITY_PROBE      -> no case; the one-off probe that proved a fresh
#                                   number registers on a real device without a
#                                   Connect invite
#
# The usernames differ per flow so a failed run's account is identifiable in the
# admin, and the backup codes differ so one flow's account cannot be opened with
# another's code by accident.







MAESTRO_SIGNUP_EMAIL_ADD:
  country_code: "+7426"
  username: "QA Email Add"
  backup_code: "742692"
  # SE_03: malformed, so CONTINUE stays disabled.
  invalid_email: "not-an-email"
  # SE_02: well-formed, so CONTINUE enables. Never receives mail - the flow only
  # checks the button state, so this must NOT be a real QA-mailbox address.
  valid_email: "qa.connect.add@example.com"

MAESTRO_SIGNUP_EMAIL_VERIFY:
  country_code: "+7426"
  username: "QA Email Verify"
  backup_code: "742693"
  # Real mailbox address: this flow reaches the Verify Email screen.
  valid_email: "automation.user.commcarehq+severify@gmail.com"
  # SE_08: rejected. Must not collide with a real code, which is why it is data
  # and not a literal - see WRONG_BACKUP_CODES in run_on_browserstack.py for the
  # same trap on backup codes.
  wrong_otp: "123456"

MAESTRO_INTEGRITY_PROBE:
  country_code: "+7426"
  # The one entry here WITH a fixed number: the probe's whole point was that this
  # specific never-invited number clears Play Integrity. Deliberately outside the
  # 1292950-1292999 batch put forward for invites.
  phone_number: "1293501"
  username: "QA Integrity Probe"

# --- CCCT-2784 fixture accounts (recovery-based) ------------------------------
#
# Long-lived accounts the Manage Profile and recovery flows RECOVER into, rather
# than registering a new account per run. The reason is concrete: an automated
# signup cannot complete on 2.64. The account is not created until the photo is
# saved, Save Photo is enabled only by a real camera capture, and Maestro on
# BrowserStack cannot drive the camera. The placeholder photo that makes signup
# automatable arrived in commcare-android 1e14ed79b (27-Aug-2026), after 2.64.
# Recovering an existing account needs no photo, so these flows run on 2.64 and
# on 2.65 alike.
#
# SEEDING: created by the seed_*.yaml flows, which must be run on a 2.65 build
# (they register, so they need the placeholder photo). Run once per environment:
#   python maestro_mobile/scripts/run_on_browserstack.py --app-env stage \
#     --flows seed_profile_fixture.yaml seed_profile_rename_fixture.yaml \
#             seed_profile_email_fixture.yaml seed_recovery_fixture.yaml
# Re-run if an environment is wiped. Seeding an account that already exists
# fails loudly on the confirm_code_view guard rather than silently recovering.
#
# Numbers differ per environment on purpose, matching the convention above: one
# PersonalID number cannot hold a session on two environments at once, and a
# local run can drive stage and prod concurrently.
#
# These four numbers are also listed in utils/test_data_gen.py's
# RESERVED_PHONE_NUMBERS so the Appium generator can never pick one and register
# over a fixture.

# Email-less by design. profile_view (MP_03) asserts no address is rendered
# anywhere on the Profile screen, so NOTHING may ever add an email to this
# account - that is why the email cases have their own fixture below.
#   -> profile_view (MP_01-MP_04), profile_discard (MP_14-MP_16),
#      profile_forget (MP_17, MP_18)
# profile_forget forgets the account, but Forget PersonalID clears device state
# only; the server account survives and is recovered again next run.
MAESTRO_PROFILE_FIXTURE:
  country_code: "+7426"
  phone_number: "1290101"
  username: "QA Profile Fixture"
  backup_code: "129101"
  phone_number_staging: "1290201"
  backup_code_staging: "129201"
  # MP_14-MP_16: typed into the name field, then discarded. Never saved, so it
  # leaves no trace on the account.
  edited_name: "QA Discarded Name"

# THE USERNAME HERE IS THE ACCOUNT'S RESTING NAME AS STORED ON THE SERVER, and it
# must stay in step with reality. Recovery is matched on phone number AND name: if
# the name typed at sign-in differs materially from the stored one, the server
# treats it as a NEW signup and the app shows the create-backup-code screen
# instead of the recovery one. Confirmed 2026-09-15, after MP_06's rename left
# these accounts unrecoverable under their old names.
#
# So the rule for every fixture: username == what is actually in the database.
#
# MP_05/MP_06 rename this account, which is exactly the hazard above. The flow now
# renames to `new_name` and then renames BACK to `username`, leaving the account
# at its resting name. `new_name` is a fixed value, deliberately: an earlier
# version used a timestamp, and when a run left the account renamed, the stored
# name was unguessable and the fixture was stranded. A fixed value means the worst
# case is a one-line edit here.
#   -> profile_edit_name (MP_05-MP_07)
MAESTRO_PROFILE_RENAME_FIXTURE:
  country_code: "+7426"
  phone_number: "1290102"
  # Prod and staging drifted to different names before the restore step existed.
  username: "QA Renamed User 34136"
  backup_code: "129102"
  phone_number_staging: "1290202"
  username_staging: "QA Renamed User 52048"
  backup_code_staging: "129202"
  # Renamed TO this, then restored. Must differ from username or Save never
  # enables - the button only reacts to a real change.
  new_name: "QA Rename Check"

# Its own account because MP_13 binds a verified email PERMANENTLY, which would
# break MP_03's "no address rendered" assertion forever. Nothing here asserts the
# account starts email-less, so it is free to keep whatever address the last run
# left on it.
#   -> profile_edit_email (MP_08-MP_13, MP_19)
MAESTRO_PROFILE_EMAIL_FIXTURE:
  country_code: "+7426"
  phone_number: "1290103"
  # Resting name on BOTH environments: MP_12 renamed these before the restore
  # step existed, and this is what the database holds.
  username: "QA Renamed Before OTP"
  backup_code: "129103"
  phone_number_staging: "1290203"
  backup_code_staging: "129203"
  invalid_email: "not-an-email"
  new_email: "automation.user.commcarehq+mpedit@gmail.com"
  # MP_12 renames the account and abandons the OTP step, proving the name commits
  # before the email does. That leaves the account renamed, so the flow restores
  # it afterwards - see the note on MAESTRO_PROFILE_RENAME_FIXTURE for why a
  # drifted name makes an account unrecoverable. Must differ from username.
  renamed: "QA Email Edit Check"

# Must stay email-less: RE_01 asserts the email step is OFFERED, which only
# happens while the account has no verified email. RE_02 skips it, so the account
# stays clean.
#   -> recovery_email_prompt (RE_01, RE_02)
MAESTRO_RECOVERY_FIXTURE:
  country_code: "+7426"
  phone_number: "1290104"
  username: "QA Recovery Fixture"
  backup_code: "129104"
  phone_number_staging: "1290204"
  backup_code_staging: "129204"
