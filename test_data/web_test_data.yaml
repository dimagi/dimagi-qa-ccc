# --- Tasking workflow automation (CCCT-2658) ---
TASKING:
  # The live task unit. Its slug is already consumed on both apps by the task
  # type J2-J4 and the hybrid test assign, so it is only creatable on a fresh
  # app copy - which is why TC-TTC-002 rides on the per-run OLP opportunity.
  task_unit_name: "Relearn Task Unit"       # visible label in the Task Unit dropdown
  task_unit_slug: "relearn_task"            # must match HQ Task Unit ID exactly (case-sensitive)
  case_property: "relearn_complete"
  # J1's sandbox type, created once from the second task unit on the static
  # opportunity and reused forever: a task-type slug is permanently consumed per
  # app, so J1 must never create a type from task_unit_slug there, and must
  # never archive the live type either.
  sandbox_unit_slug: "relearn_task_2"
  sandbox_unit_name: "Relearn Task Unit 2"
  # TC-TTC-005 renames the sandbox type on every run. The slug is never rendered
  # in the table, so the row cannot be found by slug - instead the rename toggles
  # between these two names, which makes the test stateless and repeatable.
  sandbox_name_a: "Relearn Sandbox A"
  sandbox_name_b: "Relearn Sandbox B"
  # Confirmed on staging: the "Tasks Assigned to Connect Workers" dashboard card
  # renders and links to .../assigned_tasks/, so the tile assertions (TLV-006 and
  # IMP-003) can run. Set back to false if the card disappears on an environment.
  switch_enabled: true
  # --- Static opportunity for J1/J2/J3/J4 ---
  # Deliberately long-lived (365-day window) and reused until the LDVP journey
  # exists, because automation-created opportunities only get a short window and
  # Connect blocks delivery once it ends.
  #
  # Environment-specific values follow the convention OLP_1 already uses for
  # domains and api keys: the **unsuffixed key is prod**, "<key>_staging" is
  # staging. Keys that are the same on both environments are given once.
  static_opp: "Demo Opportunity_04-Aug-2026 : 15:37"           # prod, created 04-Aug-2026
  static_opp_staging: "Demo Opportunity_31-Jul-2026 : 18:39"   # staging, created 31-Jul-2026
  static_opp_id: "d3cb6361-46ae-4b0f-8d58-7a084ca561e3"
  static_opp_id_staging: "9d533d0d-b835-488a-8726-7d2aac52df95"
  static_org: "pm_automation_01"     # PM org slug - the same on both environments
  static_nm_org: "network-manager"   # NM org slug for permission tests
  static_nm_org_name: "Network Manager"   # NM org display name for the org switcher
  static_worker: "Relearn Task User"      # enrolled worker (+74263119728)
  static_task_type: "Relearn Task Unit"   # pre-created task type on the static opp

# --- Phase 2 hybrid web -> mobile -> web (TC-E2E-001/003/006) ---
TASKING_HYBRID:
  # Long-lived tasking opportunity created 31-Jul-2026 by
  # tests/test_setup_tasking_opportunity.py: 365-day delivery window, active
  # "Relearn Task Unit" task type, worker +74263119728 invited.
  # Opportunity name: Demo Opportunity_31-Jul-2026 : 18:39
  # Same suffix convention as TASKING: unsuffixed is prod, "_staging" is staging.
  # The worker, its backup code and the task type are identical on both, so they are
  # given once below.
  org: "pm_automation_01"
  opp_id: "d3cb6361-46ae-4b0f-8d58-7a084ca561e3"
  opp_id_staging: "9d533d0d-b835-488a-8726-7d2aac52df95"
  task_type: "Relearn Task Unit"
  opportunity_name: "Demo Opportunity_04-Aug-2026 : 15:37"
  opportunity_name_staging: "Demo Opportunity_31-Jul-2026 : 18:39"
  # The mobile worker lives in test_data/mobile_workers.yaml under
  # MAESTRO_WORKER_RELEARN_TASK - one source shared with the Maestro suite, resolved
  # per environment. It is deliberately not repeated here: the number differs
  # between environments, and a copy in two files drifts into a device signing in as
  # the wrong worker on one of them.
  # Two device sessions, gated in between by the web side: the blocked visit has to
  # be seen evaluated by Connect before the task completion is submitted, because the
  # HQ -> Connect hop lags on staging and the completion can otherwise be processed
  # first. See the comment in worker_blocked_visit.yaml.
  flow_blocked_visit: "worker_blocked_visit.yaml"
  flow: "worker_relearn_task.yaml"
  # Form submission travels device -> CommCare HQ -> Connect's form receiver,
  # which is far from instant on staging, so poll generously.
  completion_timeout_seconds: 900

# Connect messaging (CCCT-2671). Unsuffixed keys are prod, `_staging` overrides
# them - the same convention the rest of this file uses.
MESSAGING:
  # Survey form the Connect Survey content type points at. Both values are
  # carried over from the legacy page object, which hardcoded them per env.
  survey_form: "Delivery App - ETE > Surveys > Survey"
  survey_form_staging: "SMS Tests [DO NOT DELETE] > Surveys > Survey"
  # HQ user id of the mobile worker every alert and broadcast is addressed to.
  # It MUST be the user that MAESTRO_MESSAGING_HYBRID signs in as on the device
  # (prod: CCC- Automationuser1, +74267426121), or the message is delivered to
  # somebody else's channel and the device waits for something that was never
  # sent to it.
  #
  # One id, not one per content type. Legacy used a second id for broadcasts
  # (MESSAGING_4_5_6 -> 001b8edd7bc3d3c58a70), which belongs to a different
  # account entirely - harmless when nothing checked the phone, wrong the moment
  # a device does.
  #
  # Prod value only. The staging id still has to be read off HQ's recipient
  # picker once "Message Automation User" is enrolled.
  worker_user_id: "049b54d12e564f418397"
  # Staging, read off HQ's recipient picker on 2026-08-12 by typing the
  # worker's name - the widget searches by name and resolves to the id, which
  # is also how a future version could drop these hardcoded ids entirely.
  worker_user_id_staging: "924dec685ba0a0dbc895"
  # The mobile channel is named after the HQ domain - ConnectID stores it as
  # channel_source and the app renders that as the channel name.
  channel_name: "connectqa-automation-prod"
  channel_name_staging: "connectqa-automation"
  # Maestro flow driving the device half of the broadcast test. The worker is
  # deliberately not repeated here: it lives in mobile_workers.yaml under
  # MAESTRO_MESSAGING_HYBRID, the single source the Maestro runner resolves per
  # environment, so web and device cannot disagree about who signs in.
  broadcast_flow: "messaging_broadcast.yaml"
  survey_flow: "messaging_survey.yaml"
  keyword_flow: "messaging_keyword.yaml"
  consent_flow: "messaging_consent.yaml"
  channel_created_flow: "messaging_channel_created.yaml"
  # How long the mid-build web trigger waits before requesting consent. It
  # must land AFTER the worker has signed in - a push sent earlier reaches a
  # device not yet registered as that user and is lost - and before the
  # flow's 600s shade wait runs out. Cold-start sign-in has been running
  # ~2.5 min on BrowserStack, so this leaves roughly a minute of margin.
  consent_trigger_delay_seconds: 210
  # The questions "Delivery App - ETE > Surveys > Survey" asks, in order. Kept as
  # data rather than baked into the flow the way legacy's fill_survey_form() did,
  # so pointing survey_form at a different form only means editing this.
  survey_q1_label: "Name"
  survey_q2_label: "ID"
  survey_q2_answer: "101"
