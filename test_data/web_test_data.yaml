  # standalone_opp: ""    # OD_22: a standalone (non-program) opportunity name
  # incomplete_opp: ""    # OD_23: an opportunity with setup not complete
  # test_opp: ""          # OD_26: an is_test opportunity name
  # microplanning_opp: "" # OD_28: an opportunity with the MICROPLANNING flag on
  # fresh_delivery_opp: "" # OD_30: an opp with deliveries/payments in last 24h
  # ended_opp: ""         # OD_37: an ended opportunity name
  # autoverify_opp: ""    # OD_43: an automatic_visit_verification opportunity
