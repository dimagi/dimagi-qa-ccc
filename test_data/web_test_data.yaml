# --- Tasking workflow automation (CCCT-2658) ---
TASKING:
  # The live task unit. Its slug is already consumed on both apps by the task
  # type J2-J4 and the hybrid test assign, so it is only creatable on a fresh
  # app copy - which is why TC-TTC-002 rides on the per-run OLP opportunity.
  task_unit_name: "Relearn Task Unit"       # visible label in the Task Unit dropdown
  task_unit_slug: "relearn_task"            # must match HQ Task Unit ID exactly (case-sensitive)
  case_property: "relearn_complete"
  # J1's sandbox type, created once from the second task unit on the static
  # opportunity and reused forever: a task-type slug is permanently consumed per
  # app, so J1 must never create a type from task_unit_slug there, and must
  # never archive the live type either.
  sandbox_unit_slug: "relearn_task_2"
  sandbox_unit_name: "Relearn Task Unit 2"
  # TC-TTC-005 renames the sandbox type on every run. The slug is never rendered
  # in the table, so the row cannot be found by slug - instead the rename toggles
  # between these two names, which makes the test stateless and repeatable.
  sandbox_name_a: "Relearn Sandbox A"
  sandbox_name_b: "Relearn Sandbox B"
  # Confirmed on staging: the "Tasks Assigned to Connect Workers" dashboard card
  # renders and links to .../assigned_tasks/, so the tile assertions (TLV-006 and
  # IMP-003) can run. Set back to false if the card disappears on an environment.
  switch_enabled: true
  # --- Static opportunity for J1/J2/J3/J4 ---
  # The deliberately long-lived opportunity (365-day window) created 31-Jul-2026;
  # reused until the LDVP journey exists, because automation-created
  # opportunities only get a 7-day window and Connect blocks delivery after it.
  static_opp: "Demo Opportunity_31-Jul-2026 : 18:39"   # opportunity name as shown in the list
  static_opp_id: "9d533d0d-b835-488a-8726-7d2aac52df95"  # UUID from the opportunity URL
  static_org: "pm_automation_01"     # PM org slug as it appears in Connect URLs
  static_nm_org: "network-manager"   # NM org slug for permission tests
  static_nm_org_name: "Network Manager"   # NM org display name for the org switcher
  static_worker: "Relearn Task User"      # enrolled worker (+74263119728)
  static_task_type: "Relearn Task Unit"   # pre-created task type on the static opp

# --- Phase 2 hybrid web -> mobile -> web (TC-E2E-001/003/006) ---
TASKING_HYBRID:
  # Long-lived tasking opportunity created 31-Jul-2026 by
  # tests/test_setup_tasking_opportunity.py: 365-day delivery window, active
  # "Relearn Task Unit" task type, worker +74263119728 invited.
  # Opportunity name: Demo Opportunity_31-Jul-2026 : 18:39
  org: "pm_automation_01"
  opp_id: "9d533d0d-b835-488a-8726-7d2aac52df95"
  task_type: "Relearn Task Unit"
  opportunity_name: "Demo Opportunity_31-Jul-2026 : 18:39"
  # Mobile worker on the +7426 demo range: no OTP, backup code is the credential.
  # Dedicated to tasking so the login/lockout flows cannot interfere with it.
  mobile_country_code: "+7426"
  mobile_phone_number: "3119728"
  mobile_username: "Relearn Task User"
  mobile_backup_code: "123456"
  flow: "worker_relearn_task.yaml"
  # Form submission travels device -> CommCare HQ -> Connect's form receiver,
  # which is far from instant on staging, so poll generously.
  completion_timeout_seconds: 900
