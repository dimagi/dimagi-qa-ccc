[execution]
run_on = browserstack

[browserstack]
BROWSERSTACK_USERNAME =
BROWSERSTACK_ACCESS_KEY =

[creds]
hq_username =
hq_password =
# Mailbox the PersonalID email OTP tests read from. Test addresses are
# plus-addressed off this one (qa+<stamp>@...), so they all land here.
# Gmail needs an app password with IMAP enabled, not the account password.
# On CI, set QA_EMAIL_ADDRESS / QA_EMAIL_IMAP_HOST / QA_EMAIL_IMAP_USER /
# QA_EMAIL_IMAP_PASSWORD as secrets instead of filling these in.
[email]
address = your.qa.mailbox@gmail.com
imap_password = your-16-char-app-password
# imap_host defaults to imap.gmail.com and imap_user defaults to address;
# only set them if your provider differs.
