name: CommCare-Connect Pytest Automation Suite

env:
  SEND_SLACK: "true"
  SEND_EMAIL: "true"

# Legacy Selenium/Appium suite. Not triggered automatically anymore - the
# Playwright (playwright_web.yaml) and Maestro (maestro_mobile.yaml) suites
# run on PRs, and the schedule was already disabled. Run manually if needed.
on:
  # schedule:
  #   - cron: '0 2 * * 1-5'   # 9:00 AM IST (PROD)
  #   - cron: '0 4 * * 1-5'

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "both"
        type: choice
        options:
          - stage
          - prod
          - both

      test_scope:
        description: "Scope"
        required: true
        default: "both"
        type: choice
        options:
          - web
          - mobile
          - both

# --------------------------------------------------------
# Resolve Matrix
# --------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  resolve-matrix:
    name: Resolve Environment Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.environment }}" = "both" ]; then
              echo 'matrix={"environment":["stage","prod"]}' >> $GITHUB_OUTPUT
            else
              echo "matrix={\"environment\":[\"${{ inputs.environment }}\"]}" >> $GITHUB_OUTPUT
            fi
          else
            # if [ "${{ github.event.schedule }}" = "0 2 * * 1-5" ]; then
            #   echo 'matrix={"environment":["prod"]}' >> $GITHUB_OUTPUT
            # elif [ "${{ github.event.schedule }}" = "0 4 * * 1-5" ]; then
            #   echo 'matrix={"environment":["stage"]}' >> $GITHUB_OUTPUT
            # else
              echo 'matrix={"environment":["stage","prod"]}' >> $GITHUB_OUTPUT
            # fi
          fi

# --------------------------------------------------------
# Web Tests
# --------------------------------------------------------

  web-tests:
    if: >
      github.event_name != 'workflow_dispatch' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.test_scope == 'web' || inputs.test_scope == 'both'))
    name: Web Tests (${{ matrix.environment }})
    needs: resolve-matrix
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}

    env:
      TEST_ENV: ${{ matrix.environment }}
      hq_username: ${{ secrets.hq_username }}
      hq_password: ${{ secrets.hq_password }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}


    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt

      - name: Run Web Tests
        run: |
          pytest -v tests/web_tests -m "not cleanup" --capture=tee-sys  --env=${{ env.TEST_ENV }} --reruns 1 --alluredir=reports/allure-results/web --junitxml=reports/web-${{ env.TEST_ENV }}.xml --html=reports/report-web-${{ env.TEST_ENV }}.html --self-contained-html --tb=short

      - name: AI Failure Analysis (Web)
        if: always()
        run: python utils/ai_failure_analyst.py reports/web-${{ env.TEST_ENV }}.xml

      - name: Upload AI Failure Report (Web)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-failure-report-web-${{ matrix.environment }}
          path: ai_failure_report.md
          if-no-files-found: ignore

      - name: Upload Web JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-web-${{ matrix.environment }}
          path: reports/web-${{ env.TEST_ENV }}.xml

      - name: Upload Web HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-web-${{ matrix.environment }}
          path: reports/report-web-${{ env.TEST_ENV }}.html

      - name: Upload Allure Results - Web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-${{ matrix.environment }}
          path: reports/allure-results/web

      - name: Upload Charts - Web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slack_charts-web-${{ matrix.environment }}
          path: slack_charts/
          if-no-files-found: ignore

      - name: Create run summary for dashboard (web)
        if: always()
        shell: bash
        env:
          TEST_ENV: ${{ matrix.environment }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p metrics_out
          python - <<'PY'
          import json, os, datetime
          import xml.etree.ElementTree as ET

          scope = "web"
          env   = os.environ.get("TEST_ENV", "unknown")

          EVENT_TRIGGER_MAP = {
              "schedule":         "Scheduled",
              "workflow_dispatch": "Manual",
              "push":             "Push/Pull",
              "pull_request":     "Push/Pull",
              "workflow_run":     "Post Deploy",
          }
          raw_event = os.environ.get("GITHUB_EVENT_NAME", "unknown")
          trigger   = EVENT_TRIGGER_MAP.get(raw_event, raw_event)

          data = {
              "timestamp_utc": datetime.datetime.utcnow().isoformat() + "Z",
              "env":     env,
              "scope":   scope,
              "suite":   f"CommCare-Connect {scope.capitalize()} Tests",
              "trigger": trigger,
              "status": "pass",
              "passed":  0,
              "failed":  0,
              "skipped": 0,
              "rerun_count": 0,
              "github": {
                  "run_id":     os.environ.get("GITHUB_RUN_ID"),
                  "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "run_url":    (
                      f"{os.environ.get('GITHUB_SERVER_URL','https://github.com')}"
                      f"/{os.environ.get('GITHUB_REPOSITORY')}"
                      f"/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
                  )
              }
          }

          xml_path = f"reports/web-{env}.xml"
          if os.path.exists(xml_path):
              tree = ET.parse(xml_path)
              root = tree.getroot()
              ts = root if root.tag == "testsuite" else root.find("testsuite")
              if ts is not None:
                  total   = int(ts.get("tests",    0))
                  failed  = int(ts.get("failures", 0)) + int(ts.get("errors", 0))
                  skipped = int(ts.get("skipped",  0))
                  data["passed"]  = max(total - failed - skipped, 0)
                  data["failed"]  = failed
                  data["skipped"] = skipped

          data["status"] = "fail" if data["failed"] > 0 else "pass"

          with open("metrics_out/run_summary.json", "w") as f:
              json.dump(data, f)
          print("run_summary.json created:", data)
          PY

      - name: Upload run summary (dashboard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-web-${{ matrix.environment }}
          path: metrics_out/run_summary.json
          retention-days: 30

# --------------------------------------------------------
# Mobile Tests
# --------------------------------------------------------

  mobile-tests:
    name: Mobile Tests (${{ matrix.environment }})
    needs: resolve-matrix
    runs-on: windows-latest

    if: >
      github.event_name != 'workflow_dispatch' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.test_scope == 'mobile' || inputs.test_scope == 'both'))

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.resolve-matrix.outputs.matrix).environment }}
#        exclude:
#          - environment: stage

    env:
      TEST_ENV: ${{ matrix.environment }}
      hq_username: ${{ secrets.hq_username }}
      hq_password: ${{ secrets.hq_password }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BIOMETRIC_ENABLED: "false"
      RUN_ON: "browserstack"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt

      - name: Run Mobile Tests
        run: |
          pytest -v tests/mobile_tests --capture=tee-sys  --env=${{ env.TEST_ENV }} --reruns 1 --alluredir=reports/allure-results/mobile --junitxml=reports/mobile-${{ env.TEST_ENV }}.xml --html=reports/report-mobile-${{ env.TEST_ENV }}.html --self-contained-html --tb=short

      - name: AI Failure Analysis (Mobile)
        if: always()
        run: python utils/ai_failure_analyst.py reports/mobile-${{ env.TEST_ENV }}.xml

      - name: Upload AI Failure Report (Mobile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-failure-report-mobile-${{ matrix.environment }}
          path: ai_failure_report.md
          if-no-files-found: ignore

      - name: Upload Mobile JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-mobile-${{ matrix.environment }}
          path: reports/mobile-${{ env.TEST_ENV }}.xml

      - name: Upload Mobile HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-mobile-${{ matrix.environment }}
          path: reports/report-mobile-${{ env.TEST_ENV }}.html

      - name: Upload Allure Results - Mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-mobile-${{ matrix.environment }}
          path: reports/allure-results/mobile

      - name: Upload Charts - Mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slack_charts-mobile-${{ matrix.environment }}
          path: slack_charts/
          if-no-files-found: ignore

      - name: Create run summary for dashboard (mobile)
        if: always()
        shell: bash
        env:
          TEST_ENV: ${{ matrix.environment }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p metrics_out
          python - <<'PY'
          import json, os, datetime
          import xml.etree.ElementTree as ET

          scope = "mobile"
          env   = os.environ.get("TEST_ENV", "unknown")

          EVENT_TRIGGER_MAP = {
              "schedule":         "Scheduled",
              "workflow_dispatch": "Manual",
              "push":             "Push/Pull",
              "pull_request":     "Push/Pull",
              "workflow_run":     "Post Deploy",
          }
          raw_event = os.environ.get("GITHUB_EVENT_NAME", "unknown")
          trigger   = EVENT_TRIGGER_MAP.get(raw_event, raw_event)

          data = {
              "timestamp_utc": datetime.datetime.utcnow().isoformat() + "Z",
              "env":     env,
              "scope":   scope,
              "suite":   f"CommCare-Connect {scope.capitalize()} Tests",
              "trigger": trigger,
              "status": "pass",
              "passed":  0,
              "failed":  0,
              "skipped": 0,
              "rerun_count": 0,
              "github": {
                  "run_id":     os.environ.get("GITHUB_RUN_ID"),
                  "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "run_url":    (
                      f"{os.environ.get('GITHUB_SERVER_URL','https://github.com')}"
                      f"/{os.environ.get('GITHUB_REPOSITORY')}"
                      f"/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
                  )
              }
          }

          xml_path = f"reports/mobile-{env}.xml"
          if os.path.exists(xml_path):
              tree = ET.parse(xml_path)
              root = tree.getroot()
              ts = root if root.tag == "testsuite" else root.find("testsuite")
              if ts is not None:
                  total   = int(ts.get("tests",    0))
                  failed  = int(ts.get("failures", 0)) + int(ts.get("errors", 0))
                  skipped = int(ts.get("skipped",  0))
                  data["passed"]  = max(total - failed - skipped, 0)
                  data["failed"]  = failed
                  data["skipped"] = skipped

          data["status"] = "fail" if data["failed"] > 0 else "pass"

          with open("metrics_out/run_summary.json", "w") as f:
              json.dump(data, f)
          print("run_summary.json created:", data)
          PY

      - name: Upload run summary (dashboard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-mobile-${{ matrix.environment }}
          path: metrics_out/run_summary.json
          retention-days: 30

# --------------------------------------------------------
# Aggregate + Notifications
# --------------------------------------------------------

  generate-report:
    name: Generate Combined Report
    runs-on: ubuntu-latest
    needs: [ web-tests, mobile-tests ]
    if: ${{ !cancelled() && (needs.web-tests.result != 'skipped' || needs.mobile-tests.result != 'skipped') }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure Reports
        if: always()
        run: |
          for dir in artifacts/allure-results-web-* artifacts/allure-results-mobile-*; do
            [ -d "$dir" ] || continue
            name="${dir##*allure-results-}"
            allure generate "$dir" -o "artifacts/allure-report-${name}" --clean
            zip -r "artifacts/allure-report-${name}.zip" "artifacts/allure-report-${name}"
          done

      - name: Upload Allure Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-reports
          path: artifacts/allure-report-*.zip
          if-no-files-found: ignore

      - name: Parse Results
        id: aggregate
        shell: bash
        run: |
          parse_results () {
            pattern=$1
            total=0; failed=0; errors=0; skipped=0;

            files=$(find artifacts -name "$pattern")
            if [ -z "$files" ]; then
              echo ""
              return
            fi

            for file in $files; do
              t=$(grep -o 'tests="[0-9]*"' "$file" | grep -o '[0-9]*' | head -1)
              f=$(grep -o 'failures="[0-9]*"' "$file" | grep -o '[0-9]*' | head -1)
              e=$(grep -o 'errors="[0-9]*"' "$file" | grep -o '[0-9]*' | head -1)
              s=$(grep -o 'skipped="[0-9]*"' "$file" | grep -o '[0-9]*' | head -1)

              total=$((total + ${t:-0}))
              failed=$((failed + ${f:-0}))
              errors=$((errors + ${e:-0}))
              skipped=$((skipped + ${s:-0}))
            done

            total_failed=$((failed + errors))
            passed=$((total - total_failed - skipped))

            if [ "$total_failed" -gt 0 ]; then
              status="FAILURE"
              color="danger"
            else
              status="SUCCESS"
              color="good"
            fi

            echo "$status,$color,$passed,$total_failed,$errors,$skipped"
          }

          # Only environments that actually produced junit xml
          envs=$(find artifacts -name "*.xml" | sed -E 's/.*-(stage|prod)\.xml/\1/' | sort -u)

          for env in $envs; do
            web="$(parse_results "web-${env}.xml")"
            mobile="$(parse_results "mobile-${env}.xml")"

            env_has_web="false"
            env_has_mobile="false"

            web_status=""; web_pass=""; web_fail=""; web_err=""; web_skip=""
            mob_status=""; mob_pass=""; mob_fail=""; mob_err=""; mob_skip=""

            if [ -n "$web" ]; then
              env_has_web="true"
              IFS=',' read web_status web_color web_pass web_fail web_err web_skip <<< "$web"
            fi

            if [ -n "$mobile" ]; then
              env_has_mobile="true"
              IFS=',' read mob_status mob_color mob_pass mob_fail mob_err mob_skip <<< "$mobile"
            fi

            # If neither scope ran for this env, skip it
            if [ "$env_has_web" != "true" ] && [ "$env_has_mobile" != "true" ]; then
              continue
            fi

            # Env status = FAILURE if any executed scope failed
            if [ "$web_status" = "FAILURE" ] || [ "$mob_status" = "FAILURE" ]; then
              env_status="FAILURE"
              env_color="danger"
            else
              env_status="SUCCESS"
              env_color="good"
            fi

            echo "${env}_status=$env_status" >> $GITHUB_OUTPUT
            echo "${env}_color=$env_color" >> $GITHUB_OUTPUT

            echo "${env}_has_web=$env_has_web" >> $GITHUB_OUTPUT
            echo "${env}_has_mobile=$env_has_mobile" >> $GITHUB_OUTPUT

            echo "${env}_web_pass=$web_pass" >> $GITHUB_OUTPUT
            echo "${env}_web_fail=$web_fail" >> $GITHUB_OUTPUT
            echo "${env}_web_err=$web_err" >> $GITHUB_OUTPUT
            echo "${env}_web_skip=$web_skip" >> $GITHUB_OUTPUT

            echo "${env}_mobile_pass=$mob_pass" >> $GITHUB_OUTPUT
            echo "${env}_mobile_fail=$mob_fail" >> $GITHUB_OUTPUT
            echo "${env}_mobile_err=$mob_err" >> $GITHUB_OUTPUT
            echo "${env}_mobile_skip=$mob_skip" >> $GITHUB_OUTPUT

            # NEWLINE-separated attachments (what action-send-mail expects)
            web_file="$(find artifacts -name "report-web-${env}.html" | head -1)"
            mob_file="$(find artifacts -name "report-mobile-${env}.html" | head -1)"

            att=""
            if [ "$env_has_web" = "true" ] && [ -n "$web_file" ] && [ -f "$web_file" ]; then
              att="${att}${web_file}"$'\n'
            fi
            if [ "$env_has_mobile" = "true" ] && [ -n "$mob_file" ] && [ -f "$mob_file" ]; then
              att="${att}${mob_file}"$'\n'
            fi

            {
              echo "${env}_attachments<<EOF"
              printf "%s" "$att"
              echo
              echo "EOF"
            } >> $GITHUB_OUTPUT
          done

      # -----------------------------
      # Slack Notifications
      # -----------------------------

      - name: Post AI Analysis as PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const envs = ['stage', 'prod'];
            const scopes = ['web', 'mobile'];
            let body = '## :robot: AI Failure Analysis\n\n';
            let hasContent = false;

            for (const env of envs) {
              for (const scope of scopes) {
                const reportPath = `artifacts/ai-failure-report-${scope}-${env}/ai_failure_report.md`;
                if (fs.existsSync(reportPath)) {
                  const content = fs.readFileSync(reportPath, 'utf8').trim();
                  if (content && !content.includes('No failures')) {
                    body += `<details>\n<summary><b>${scope.toUpperCase()} — ${env.toUpperCase()}</b></summary>\n\n${content}\n\n</details>\n\n`;
                    hasContent = true;
                  }
                }
              }
            }

            if (!hasContent) {
              console.log('No AI failure reports found — skipping PR comment.');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.startsWith('## :robot: AI Failure Analysis'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Slack Notify + Charts + AI Analysis - Stage
        if: ${{ steps.aggregate.outputs.stage_status != '' && env.SEND_SLACK == 'true' }}
        env:
          SLACK_TOKEN:   ${{ secrets.SLACK_QA_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID_TESTS }}
          GITHUB_TOKEN:  ${{ github.token }}
          ENV_NAME:      stage
          ENV_STATUS:    ${{ steps.aggregate.outputs.stage_status }}
          HAS_WEB:       ${{ steps.aggregate.outputs.stage_has_web }}
          HAS_MOBILE:    ${{ steps.aggregate.outputs.stage_has_mobile }}
          WEB_PASS:      ${{ steps.aggregate.outputs.stage_web_pass }}
          WEB_FAIL:      ${{ steps.aggregate.outputs.stage_web_fail }}
          WEB_ERR:       ${{ steps.aggregate.outputs.stage_web_err }}
          WEB_SKIP:      ${{ steps.aggregate.outputs.stage_web_skip }}
          MOB_PASS:      ${{ steps.aggregate.outputs.stage_mobile_pass }}
          MOB_FAIL:      ${{ steps.aggregate.outputs.stage_mobile_fail }}
          MOB_ERR:       ${{ steps.aggregate.outputs.stage_mobile_err }}
          MOB_SKIP:      ${{ steps.aggregate.outputs.stage_mobile_skip }}
        shell: bash
        run: |
          pip install --quiet slack_sdk
          python - <<'PY'
          import os, pathlib
          from slack_sdk import WebClient
          from slack_sdk.errors import SlackApiError

          token   = os.environ.get("SLACK_TOKEN", "")
          channel = os.environ.get("SLACK_CHANNEL", "")
          if not token or not channel:
              print("Slack token/channel not configured — skipping")
              raise SystemExit(0)

          env_name   = os.environ.get("ENV_NAME", "stage")
          env        = env_name.upper()
          status     = os.environ.get("ENV_STATUS", "")
          icon       = "✅" if status == "SUCCESS" else "❌"
          has_web    = os.environ.get("HAS_WEB", "false").lower() == "true"
          has_mobile = os.environ.get("HAS_MOBILE", "false").lower() == "true"
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "")
          run_id     = os.environ.get("GITHUB_RUN_ID", "")
          repo       = os.environ.get("GITHUB_REPOSITORY", "")
          server     = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          run_url    = f"{server}/{repo}/actions/runs/{run_id}"
          dashboard_url = "https://dimagi.github.io/dimagi-qa-ccc/"
          env_lower  = env_name.lower()
          gh_token   = os.environ.get("GITHUB_TOKEN", "")

          def get_artifact_url(scope, env_lower):
              import urllib.request, json as _json
              artifact_name = f"html-{scope}-{env_lower}"
              api_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
              req = urllib.request.Request(api_url, headers={"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      data = _json.loads(r.read())
                  for a in data.get("artifacts", []):
                      if a["name"] == artifact_name:
                          return f"{server}/{repo}/actions/runs/{run_id}/artifacts/{a['id']}"
              except Exception as e:
                  print(f"Could not fetch artifact ID for {artifact_name}: {e}")
              return run_url

          client = WebClient(token=token)

          scope_info = {
              "web":    {"has": has_web,    "pass": os.environ.get("WEB_PASS", 0), "fail": os.environ.get("WEB_FAIL", 0), "skip": os.environ.get("WEB_SKIP", 0), "icon": "🌐"},
              "mobile": {"has": has_mobile, "pass": os.environ.get("MOB_PASS", 0), "fail": os.environ.get("MOB_FAIL", 0), "skip": os.environ.get("MOB_SKIP", 0), "icon": "📱"},
          }

          for scope in ["web", "mobile"]:
              info = scope_info[scope]
              if not info["has"]:
                  continue

              artifact_url = get_artifact_url(scope, env_lower)
              scope_icon = "✅" if int(info["fail"] or 0) == 0 else "❌"
              comment = (
                  f"{scope_icon} 📊 [{env}] CommCare-Connect {scope.capitalize()} Tests — Run #{run_number}\n"
                  f"{info['icon']} {scope.capitalize()} → ✅ {info['pass']} | ❌ {info['fail']} | ⏭ {info['skip']}\n"
                  f"📎 Artifact: <{artifact_url}|Download here>\n"
                  f"🔗 Dashboard: <{dashboard_url}|{dashboard_url}>"
              )

              chart = pathlib.Path(f"artifacts/slack_charts-{scope}-{env_lower}/summary_combined.png")
              parent_ts = None

              if chart.exists():
                  try:
                      resp = client.files_upload_v2(
                          file=str(chart),
                          filename=f"summary_combined_{scope}_{env_lower}.png",
                          title="summary combined",
                          channel=channel,
                          initial_comment=comment,
                      )
                      try:
                          shares = resp.get("file", {}).get("shares", {})
                          for visibility in ("private", "public"):
                              ch_shares = shares.get(visibility, {}).get(channel, [])
                              if ch_shares:
                                  parent_ts = ch_shares[0].get("ts")
                                  break
                      except Exception:
                          pass
                      # Fallback: find ts via channel history if not in shares response
                      if not parent_ts:
                          import time
                          time.sleep(2)
                          try:
                              now = time.time()
                              history = client.conversations_history(channel=channel, limit=5)
                              for msg in history.get("messages", []):
                                  if now - float(msg.get("ts", 0)) < 60 and msg.get("files"):
                                      msg_text = msg.get("text", "") or ""
                                      file_comment = (msg.get("files") or [{}])[0].get("initial_comment", {}).get("comment", "") or ""
                                      combined = (msg_text + file_comment).lower()
                                      if env_lower in combined and scope in combined:
                                          parent_ts = msg["ts"]
                                          break
                          except Exception as ts_err:
                              print(f"Could not get ts from history: {ts_err}")
                      print(f"Chart uploaded for {scope}-{env_lower}, parent_ts={parent_ts}")
                  except Exception as e:
                      print(f"Chart upload failed ({scope}): {e}")
                      try:
                          resp = client.chat_postMessage(channel=channel, text=comment, mrkdwn=True)
                          parent_ts = resp["ts"]
                      except Exception as e2:
                          print(f"chat_postMessage fallback failed: {e2}")
              else:
                  print(f"No chart found: {chart}")
                  try:
                      resp = client.chat_postMessage(channel=channel, text=comment, mrkdwn=True)
                      parent_ts = resp["ts"]
                  except SlackApiError as e:
                      print(f"chat_postMessage failed: {e}")

              if parent_ts:
                  report = pathlib.Path(f"artifacts/ai-failure-report-{scope}-{env_lower}/ai_failure_report.md")
                  if report.exists():
                      content = report.read_text(encoding="utf-8").strip()
                      if content and "No failures" not in content:
                          if len(content) > 3000:
                              content = content[:3000] + "\n... [see artifact for full report]"
                          try:
                              client.chat_postMessage(
                                  channel=channel,
                                  thread_ts=parent_ts,
                                  text=f"🤖 *AI Failure Analysis — {scope.upper()} ({env})*\n\n{content}",
                                  mrkdwn=True,
                              )
                              print(f"AI analysis posted for {scope}-{env_lower}")
                          except Exception as e:
                              print(f"AI thread failed ({scope}): {e}")
          PY

      - name: Slack Notify + Charts + AI Analysis - Prod
        if: ${{ steps.aggregate.outputs.prod_status != '' && env.SEND_SLACK == 'true' }}
        env:
          SLACK_TOKEN:   ${{ secrets.SLACK_QA_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID_TESTS }}
          GITHUB_TOKEN:  ${{ github.token }}
          ENV_NAME:      prod
          ENV_STATUS:    ${{ steps.aggregate.outputs.prod_status }}
          HAS_WEB:       ${{ steps.aggregate.outputs.prod_has_web }}
          HAS_MOBILE:    ${{ steps.aggregate.outputs.prod_has_mobile }}
          WEB_PASS:      ${{ steps.aggregate.outputs.prod_web_pass }}
          WEB_FAIL:      ${{ steps.aggregate.outputs.prod_web_fail }}
          WEB_ERR:       ${{ steps.aggregate.outputs.prod_web_err }}
          WEB_SKIP:      ${{ steps.aggregate.outputs.prod_web_skip }}
          MOB_PASS:      ${{ steps.aggregate.outputs.prod_mobile_pass }}
          MOB_FAIL:      ${{ steps.aggregate.outputs.prod_mobile_fail }}
          MOB_ERR:       ${{ steps.aggregate.outputs.prod_mobile_err }}
          MOB_SKIP:      ${{ steps.aggregate.outputs.prod_mobile_skip }}
        shell: bash
        run: |
          pip install --quiet slack_sdk
          python - <<'PY'
          import os, pathlib
          from slack_sdk import WebClient
          from slack_sdk.errors import SlackApiError

          token   = os.environ.get("SLACK_TOKEN", "")
          channel = os.environ.get("SLACK_CHANNEL", "")
          if not token or not channel:
              print("Slack token/channel not configured — skipping")
              raise SystemExit(0)

          env_name   = os.environ.get("ENV_NAME", "prod")
          env        = env_name.upper()
          status     = os.environ.get("ENV_STATUS", "")
          icon       = "✅" if status == "SUCCESS" else "❌"
          has_web    = os.environ.get("HAS_WEB", "false").lower() == "true"
          has_mobile = os.environ.get("HAS_MOBILE", "false").lower() == "true"
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "")
          run_id     = os.environ.get("GITHUB_RUN_ID", "")
          repo       = os.environ.get("GITHUB_REPOSITORY", "")
          server     = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          run_url    = f"{server}/{repo}/actions/runs/{run_id}"
          dashboard_url = "https://dimagi.github.io/dimagi-qa-ccc/"
          env_lower  = env_name.lower()
          gh_token   = os.environ.get("GITHUB_TOKEN", "")

          def get_artifact_url(scope, env_lower):
              import urllib.request, json as _json
              artifact_name = f"html-{scope}-{env_lower}"
              api_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
              req = urllib.request.Request(api_url, headers={"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      data = _json.loads(r.read())
                  for a in data.get("artifacts", []):
                      if a["name"] == artifact_name:
                          return f"{server}/{repo}/actions/runs/{run_id}/artifacts/{a['id']}"
              except Exception as e:
                  print(f"Could not fetch artifact ID for {artifact_name}: {e}")
              return run_url

          client = WebClient(token=token)

          scope_info = {
              "web":    {"has": has_web,    "pass": os.environ.get("WEB_PASS", 0), "fail": os.environ.get("WEB_FAIL", 0), "skip": os.environ.get("WEB_SKIP", 0), "icon": "🌐"},
              "mobile": {"has": has_mobile, "pass": os.environ.get("MOB_PASS", 0), "fail": os.environ.get("MOB_FAIL", 0), "skip": os.environ.get("MOB_SKIP", 0), "icon": "📱"},
          }

          for scope in ["web", "mobile"]:
              info = scope_info[scope]
              if not info["has"]:
                  continue

              artifact_url = get_artifact_url(scope, env_lower)
              scope_icon = "✅" if int(info["fail"] or 0) == 0 else "❌"
              comment = (
                  f"{scope_icon} 📊 [{env}] CommCare-Connect {scope.capitalize()} Tests — Run #{run_number}\n"
                  f"{info['icon']} {scope.capitalize()} → ✅ {info['pass']} | ❌ {info['fail']} | ⏭ {info['skip']}\n"
                  f"📎 Artifact: <{artifact_url}|Download here>\n"
                  f"🔗 Dashboard: <{dashboard_url}|{dashboard_url}>"
              )

              chart = pathlib.Path(f"artifacts/slack_charts-{scope}-{env_lower}/summary_combined.png")
              parent_ts = None

              if chart.exists():
                  try:
                      resp = client.files_upload_v2(
                          file=str(chart),
                          filename=f"summary_combined_{scope}_{env_lower}.png",
                          title="summary combined",
                          channel=channel,
                          initial_comment=comment,
                      )
                      try:
                          shares = resp.get("file", {}).get("shares", {})
                          for visibility in ("private", "public"):
                              ch_shares = shares.get(visibility, {}).get(channel, [])
                              if ch_shares:
                                  parent_ts = ch_shares[0].get("ts")
                                  break
                      except Exception:
                          pass
                      # Fallback: find ts via channel history if not in shares response
                      if not parent_ts:
                          import time
                          time.sleep(2)
                          try:
                              now = time.time()
                              history = client.conversations_history(channel=channel, limit=5)
                              for msg in history.get("messages", []):
                                  if now - float(msg.get("ts", 0)) < 60 and msg.get("files"):
                                      msg_text = msg.get("text", "") or ""
                                      file_comment = (msg.get("files") or [{}])[0].get("initial_comment", {}).get("comment", "") or ""
                                      combined = (msg_text + file_comment).lower()
                                      if env_lower in combined and scope in combined:
                                          parent_ts = msg["ts"]
                                          break
                          except Exception as ts_err:
                              print(f"Could not get ts from history: {ts_err}")
                      print(f"Chart uploaded for {scope}-{env_lower}, parent_ts={parent_ts}")
                  except Exception as e:
                      print(f"Chart upload failed ({scope}): {e}")
                      try:
                          resp = client.chat_postMessage(channel=channel, text=comment, mrkdwn=True)
                          parent_ts = resp["ts"]
                      except Exception as e2:
                          print(f"chat_postMessage fallback failed: {e2}")
              else:
                  print(f"No chart found: {chart}")
                  try:
                      resp = client.chat_postMessage(channel=channel, text=comment, mrkdwn=True)
                      parent_ts = resp["ts"]
                  except SlackApiError as e:
                      print(f"chat_postMessage failed: {e}")

              if parent_ts:
                  report = pathlib.Path(f"artifacts/ai-failure-report-{scope}-{env_lower}/ai_failure_report.md")
                  if report.exists():
                      content = report.read_text(encoding="utf-8").strip()
                      if content and "No failures" not in content:
                          if len(content) > 3000:
                              content = content[:3000] + "\n... [see artifact for full report]"
                          try:
                              client.chat_postMessage(
                                  channel=channel,
                                  thread_ts=parent_ts,
                                  text=f"🤖 *AI Failure Analysis — {scope.upper()} ({env})*\n\n{content}",
                                  mrkdwn=True,
                              )
                              print(f"AI analysis posted for {scope}-{env_lower}")
                          except Exception as e:
                              print(f"AI thread failed ({scope}): {e}")
          PY

      # -----------------------------
      # Email Notifications
      # -----------------------------

      - name: Send Email - Stage
        if: ${{ steps.aggregate.outputs.stage_status != '' && env.SEND_EMAIL == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.FROM_EMAIL_USERNAME }}
          password: ${{ secrets.FROM_EMAIL_PASSWORD }}
          subject: >
            CommCare-Connect STAGE -
            ${{ steps.aggregate.outputs.stage_status }} -
            Run #${{ github.run_number }}
          to: ${{ secrets.TO_EMAIL_USERNAME }}, qa@dimagi.com, anshu.shaik@fissionlabs.com, sameena.shaik@fissionlabs.com
          from: ${{ secrets.FROM_EMAIL_USERNAME }}
          html_body: |
            <h2>CommCare-Connect Test Automation Report - STAGE</h2>
            <p><b>Run:</b> #${{ github.run_number }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>

            ${{ steps.aggregate.outputs.stage_has_web == 'true' && format('<h3>Web Results</h3><ul><li><b>Passed:</b> {0}</li><li><b>Failed:</b> {1}</li><li><b>Errors:</b> {2}</li><li><b>Skipped:</b> {3}</li></ul>', steps.aggregate.outputs.stage_web_pass, steps.aggregate.outputs.stage_web_fail, steps.aggregate.outputs.stage_web_err, steps.aggregate.outputs.stage_web_skip) || '' }}

            ${{ steps.aggregate.outputs.stage_has_mobile == 'true' && format('<h3>Mobile Results</h3><ul><li><b>Passed:</b> {0}</li><li><b>Failed:</b> {1}</li><li><b>Errors:</b> {2}</li><li><b>Skipped:</b> {3}</li></ul>', steps.aggregate.outputs.stage_mobile_pass, steps.aggregate.outputs.stage_mobile_fail, steps.aggregate.outputs.stage_mobile_err, steps.aggregate.outputs.stage_mobile_skip) || '' }}

            <br>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
            View Full Run
            </a>
          attachments: ${{ steps.aggregate.outputs.stage_attachments }}

      - name: Send Email - Prod
        if: ${{ steps.aggregate.outputs.prod_status != '' && env.SEND_EMAIL == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.FROM_EMAIL_USERNAME }}
          password: ${{ secrets.FROM_EMAIL_PASSWORD }}
          subject: >
            CommCare-Connect PROD -
            ${{ steps.aggregate.outputs.prod_status }} -
            Run #${{ github.run_number }}
          to: ${{ secrets.TO_EMAIL_USERNAME }}, qa@dimagi.com, anshu.shaik@fissionlabs.com, sameena.shaik@fissionlabs.com
          from: ${{ secrets.FROM_EMAIL_USERNAME }}
          html_body: |
            <h2>CommCare-Connect Test Automation Report - PROD</h2>
            <p><b>Run:</b> #${{ github.run_number }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>

            ${{ steps.aggregate.outputs.prod_has_web == 'true' && format('<h3>Web Results</h3><ul><li><b>Passed:</b> {0}</li><li><b>Failed:</b> {1}</li><li><b>Errors:</b> {2}</li><li><b>Skipped:</b> {3}</li></ul>', steps.aggregate.outputs.prod_web_pass, steps.aggregate.outputs.prod_web_fail, steps.aggregate.outputs.prod_web_err, steps.aggregate.outputs.prod_web_skip) || '' }}

            ${{ steps.aggregate.outputs.prod_has_mobile == 'true' && format('<h3>Mobile Results</h3><ul><li><b>Passed:</b> {0}</li><li><b>Failed:</b> {1}</li><li><b>Errors:</b> {2}</li><li><b>Skipped:</b> {3}</li></ul>', steps.aggregate.outputs.prod_mobile_pass, steps.aggregate.outputs.prod_mobile_fail, steps.aggregate.outputs.prod_mobile_err, steps.aggregate.outputs.prod_mobile_skip) || '' }}

            <br>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
            View Full Run
            </a>
          attachments: ${{ steps.aggregate.outputs.prod_attachments }}

      - name: Fail Workflow If Tests Failed
        if: ${{ steps.aggregate.outputs.stage_status == 'FAILURE' || steps.aggregate.outputs.prod_status == 'FAILURE' }}
        run: exit 1
