name: CommCare-Connect Maestro Mobile Suite

env:
  SEND_EMAIL: "true"
  SEND_SLACK: "true"

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'maestro_mobile/**'
      - 'app/**'
      - '.github/workflows/maestro_mobile.yaml'

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "stage"
        type: choice
        options:
          - stage
          - prod
          - both

# Keyed on the environment as well, so a stage run and a prod run of the same
# branch do not cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'push' }}
  cancel-in-progress: true

jobs:
  resolve-matrix:
    name: Resolve Environment Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.environment }}" = "both" ]; then
              echo 'matrix={"environment":["stage","prod"]}' >> $GITHUB_OUTPUT
            else
              echo "matrix={\"environment\":[\"${{ inputs.environment }}\"]}" >> $GITHUB_OUTPUT
            fi
          else
            echo 'matrix={"environment":["stage","prod"]}' >> $GITHUB_OUTPUT
          fi

  maestro-mobile:
    name: Maestro Mobile Tests (${{ matrix.environment }})
    needs: resolve-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
      # One device build at a time. The web suite's hybrid test also takes a
      # BrowserStack session, so a push can want several at once; serialising the
      # cheap half (a mobile run is ~5 minutes) keeps us under the parallel limit.
      max-parallel: 1

    env:
      APP_ENV: ${{ matrix.environment }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # pyyaml: the runner reads test_data/mobile_workers.yaml to resolve each
        # flow's worker for this environment.
        run: pip install requests pyyaml

      # The report's trend line needs the previous runs' pass rates, and reports are
      # artifacts rather than committed files. Cached per environment: stage and prod
      # are different systems, so one shared history would average two unrelated pass
      # rates into a number describing neither.
      - name: Restore report history
        uses: actions/cache/restore@v4
        with:
          path: maestro_history_${{ matrix.environment }}.json
          key: maestro-history-${{ matrix.environment }}-${{ github.run_id }}
          restore-keys: maestro-history-${{ matrix.environment }}-

      - name: Run Maestro flows on BrowserStack
        id: bs
        # Uploads the environment's APK and maestro_mobile/flows, runs them on a
        # real device via App Automate, and polls until the build finishes. Exits
        # non-zero unless the build status is "passed".
        run: |
          set -o pipefail
          python maestro_mobile/scripts/run_on_browserstack.py --app-env "$APP_ENV" | tee bs_output.log

      - name: Parse Results
        id: aggregate
        if: always()
        shell: bash
        run: |
          if [ -f maestro_report.json ]; then
            python - <<'PY' >> $GITHUB_OUTPUT
          import json
          d = json.load(open("maestro_report.json"))
          print(f"status={d['status']}")
          print(f"passed={d['passed']}")
          print(f"failed={d['failed']}")
          print(f"skipped={d['skipped']}")
          print(f"url={d['build_url']}")
          PY
          else
            {
              echo "status=FAILURE"
              echo "passed=0"; echo "failed=0"; echo "skipped=0"
              echo "url=https://app-automate.browserstack.com/"
            } >> $GITHUB_OUTPUT
          fi

      - name: Save report history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: maestro_history_${{ matrix.environment }}.json
          key: maestro-history-${{ matrix.environment }}-${{ github.run_id }}

      - name: Upload Report
        id: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per environment: upload-artifact@v4 rejects two uploads sharing a name,
          # so the stage and prod legs of one run would collide.
          name: maestro-mobile-report-${{ matrix.environment }}
          path: |
            maestro_report.html
            maestro_report.json
          if-no-files-found: ignore

      - name: Send Email Report
        if: ${{ always() && env.SEND_EMAIL == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.FROM_EMAIL_USERNAME }}
          password: ${{ secrets.FROM_EMAIL_PASSWORD }}
          subject: >
            CommCare-Connect Maestro Mobile [${{ matrix.environment }}] -
            ${{ steps.aggregate.outputs.status }} -
            Run #${{ github.run_number }}
          to: ${{ secrets.TO_EMAIL_USERNAME }}, qa@dimagi.com, anshu.shaik@fissionlabs.com, sameena.shaik@fissionlabs.com
          from: ${{ secrets.FROM_EMAIL_USERNAME }}
          html_body: |
            <h2>CommCare-Connect Maestro Mobile Report — ${{ matrix.environment }}</h2>
            <p><b>Run:</b> #${{ github.run_number }}</p>
            <p><b>Branch:</b> ${{ github.head_ref || github.ref_name }}</p>
            <p><b>Triggered by:</b> ${{ github.actor }}</p>
            <h3>Results</h3>
            <ul>
              <li><b>Passed:</b> ${{ steps.aggregate.outputs.passed }}</li>
              <li><b>Failed:</b> ${{ steps.aggregate.outputs.failed }}</li>
              <li><b>Skipped:</b> ${{ steps.aggregate.outputs.skipped }}</li>
            </ul>
            <p>Flow-level results, device video, and logs are on the
            <a href="${{ steps.aggregate.outputs.url }}">BrowserStack build dashboard</a>.</p>
            <br>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
            View Full Run
            </a>
          attachments: maestro_report.html

      - name: Slack Notify
        if: ${{ always() && env.SEND_SLACK == 'true' }}
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_QA_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID_TESTS }}
          STATUS: ${{ steps.aggregate.outputs.status }}
          PASSED: ${{ steps.aggregate.outputs.passed }}
          FAILED: ${{ steps.aggregate.outputs.failed }}
          SKIPPED: ${{ steps.aggregate.outputs.skipped }}
          BS_URL: ${{ steps.aggregate.outputs.url }}
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        shell: bash
        run: |
          pip install --quiet slack_sdk
          python - <<'PY'
          import os
          from slack_sdk import WebClient

          token = os.environ.get("SLACK_TOKEN", "")
          channel = os.environ.get("SLACK_CHANNEL", "")
          if not token or not channel:
              print("Slack token/channel not configured - skipping")
              raise SystemExit(0)

          status = os.environ.get("STATUS", "FAILURE")
          icon = "✅" if status == "SUCCESS" else "❌"
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          bs_url = os.environ.get("BS_URL", "https://app-automate.browserstack.com/")
          artifact_url = os.environ.get("ARTIFACT_URL") or run_url
          app_env = os.environ.get("APP_ENV", "").upper()

          actor = os.environ.get("GITHUB_ACTOR", "")
          message = (
              f"{icon} 📊 [{app_env}] CommCare-Connect Maestro Mobile Tests — Run #{run_number}\n"
              f"👤 Triggered by: {actor}\n"
              f"📱 Mobile → ✅ {os.environ.get('PASSED', 0)} | ❌ {os.environ.get('FAILED', 0)} | ⏭ {os.environ.get('SKIPPED', 0)}\n"
              f"📎 Report: <{artifact_url}|Download here>\n"
              f"🎥 Device video and logs: <{bs_url}|BrowserStack build>\n"
              f"🔗 Run: <{run_url}|View on GitHub>"
          )
          WebClient(token=token).chat_postMessage(channel=channel, text=message)
          print("Slack notification sent")
          PY
