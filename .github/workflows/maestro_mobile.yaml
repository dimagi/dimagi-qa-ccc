name: CommCare-Connect Maestro Mobile Suite

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'maestro_mobile/**'
      - 'app/**'
      - '.github/workflows/maestro_mobile.yaml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-mobile:
    name: Maestro Mobile Tests (BrowserStack)
    runs-on: ubuntu-latest

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Maestro flows on BrowserStack
        # Uploads the staging APK and maestro_mobile/flows, runs them on a real
        # device via App Automate, and polls until the build finishes. Exits
        # non-zero unless the build status is "passed".
        run: python maestro_mobile/scripts/run_on_browserstack.py
