name: CommCare-Connect Maestro Mobile Suite

env:
  SEND_EMAIL: "true"
  SEND_SLACK: "true"

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'maestro_mobile/**'
      - 'app/**'
      - '.github/workflows/maestro_mobile.yaml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-mobile:
    name: Maestro Mobile Tests (BrowserStack)
    runs-on: ubuntu-latest

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Maestro flows on BrowserStack
        id: bs
        # Uploads the staging APK and maestro_mobile/flows, runs them on a real
        # device via App Automate, and polls until the build finishes. Exits
        # non-zero unless the build status is "passed".
        run: |
          set -o pipefail
          python maestro_mobile/scripts/run_on_browserstack.py | tee bs_output.log

      - name: Parse Results
        id: aggregate
        if: always()
        shell: bash
        run: |
          if [ -f maestro_report.json ]; then
            python - <<'PY' >> $GITHUB_OUTPUT
          import json
          d = json.load(open("maestro_report.json"))
          print(f"status={d['status']}")
          print(f"passed={d['passed']}")
          print(f"failed={d['failed']}")
          print(f"skipped={d['skipped']}")
          print(f"url={d['build_url']}")
          PY
          else
            {
              echo "status=FAILURE"
              echo "passed=0"; echo "failed=0"; echo "skipped=0"
              echo "url=https://app-automate.browserstack.com/"
            } >> $GITHUB_OUTPUT
          fi

      - name: Upload Report
        id: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-mobile-report
          path: |
            maestro_report.html
            maestro_report.json
          if-no-files-found: ignore

      - name: Send Email Report
        if: ${{ always() && env.SEND_EMAIL == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.FROM_EMAIL_USERNAME }}
          password: ${{ secrets.FROM_EMAIL_PASSWORD }}
          subject: >
            CommCare-Connect Maestro Mobile -
            ${{ steps.aggregate.outputs.status }} -
            Run #${{ github.run_number }}
          to: ${{ secrets.TO_EMAIL_USERNAME }}, qa@dimagi.com, anshu.shaik@fissionlabs.com, sameena.shaik@fissionlabs.com
          from: ${{ secrets.FROM_EMAIL_USERNAME }}
          html_body: |
            <h2>CommCare-Connect Maestro Mobile Report</h2>
            <p><b>Run:</b> #${{ github.run_number }}</p>
            <p><b>Branch:</b> ${{ github.head_ref || github.ref_name }}</p>
            <h3>Results</h3>
            <ul>
              <li><b>Passed:</b> ${{ steps.aggregate.outputs.passed }}</li>
              <li><b>Failed:</b> ${{ steps.aggregate.outputs.failed }}</li>
              <li><b>Skipped:</b> ${{ steps.aggregate.outputs.skipped }}</li>
            </ul>
            <p>Flow-level results, device video, and logs are on the
            <a href="${{ steps.aggregate.outputs.url }}">BrowserStack build dashboard</a>.</p>
            <br>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
            View Full Run
            </a>
          attachments: maestro_report.html

      - name: Slack Notify
        if: ${{ always() && env.SEND_SLACK == 'true' }}
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_QA_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID_TESTS }}
          STATUS: ${{ steps.aggregate.outputs.status }}
          PASSED: ${{ steps.aggregate.outputs.passed }}
          FAILED: ${{ steps.aggregate.outputs.failed }}
          SKIPPED: ${{ steps.aggregate.outputs.skipped }}
          BS_URL: ${{ steps.aggregate.outputs.url }}
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        shell: bash
        run: |
          pip install --quiet slack_sdk
          python - <<'PY'
          import os
          from slack_sdk import WebClient

          token = os.environ.get("SLACK_TOKEN", "")
          channel = os.environ.get("SLACK_CHANNEL", "")
          if not token or not channel:
              print("Slack token/channel not configured - skipping")
              raise SystemExit(0)

          status = os.environ.get("STATUS", "FAILURE")
          icon = "✅" if status == "SUCCESS" else "❌"
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          bs_url = os.environ.get("BS_URL", "https://app-automate.browserstack.com/")
          artifact_url = os.environ.get("ARTIFACT_URL") or run_url

          message = (
              f"{icon} 📊 CommCare-Connect Maestro Mobile Tests — Run #{run_number}\n"
              f"📱 Mobile → ✅ {os.environ.get('PASSED', 0)} | ❌ {os.environ.get('FAILED', 0)} | ⏭ {os.environ.get('SKIPPED', 0)}\n"
              f"📎 Report: <{artifact_url}|Download here>\n"
              f"🎥 Device video and logs: <{bs_url}|BrowserStack build>\n"
              f"🔗 Run: <{run_url}|View on GitHub>"
          )
          WebClient(token=token).chat_postMessage(channel=channel, text=message)
          print("Slack notification sent")
          PY
