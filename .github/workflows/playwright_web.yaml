name: CommCare-Connect Playwright Web Suite

env:
  SEND_EMAIL: "true"
  SEND_SLACK: "true"

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'playwright_web/**'
      - 'test_data/web_test_data.yaml'
      - 'config/env.yaml'
      - '.github/workflows/playwright_web.yaml'

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "stage"
        type: choice
        options:
          - stage
          - prod
          - both

# A push cancels the previous push's run - newest commit wins - but a manual
# dispatch is its own group, so dispatching one environment does not kill a run
# covering the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'push' }}
  cancel-in-progress: true

jobs:
  resolve-matrix:
    name: Resolve Environment Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        # Manual dispatch runs whatever was asked for; anything else - a push to a
        # PR - runs both environments, so a change is never merged having only been
        # proven against staging.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.environment }}" = "both" ]; then
              echo 'matrix={"environment":["stage","prod"]}' >> $GITHUB_OUTPUT
            else
              echo "matrix={\"environment\":[\"${{ inputs.environment }}\"]}" >> $GITHUB_OUTPUT
            fi
          else
            echo 'matrix={"environment":["stage","prod"]}' >> $GITHUB_OUTPUT
          fi

  playwright-web:
    name: Playwright Web Tests (${{ matrix.environment }})
    needs: resolve-matrix
    runs-on: ubuntu-latest
    strategy:
      # Report both environments even when one fails - a prod-only failure is the
      # interesting case and cancelling it would hide it.
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}

    env:
      TEST_ENV: ${{ matrix.environment }}
      hq_username: ${{ secrets.hq_username }}
      hq_password: ${{ secrets.hq_password }}
      # Per-PR runs skip on_demand tests (real-device Maestro builds); a manual
      # workflow_dispatch runs everything.
      PYTEST_MARKERS: ${{ github.event_name == 'pull_request' && 'not on_demand' || '' }}
      # The hybrid tasking test drives a real device mid-test, so this job needs the
      # same BrowserStack credentials the Maestro workflow uses. It used to
      # self-skip while TASKING_HYBRID was unset, which is why they were not here.
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Slack Start Notify
        id: slack_start
        # Post an "in progress" kickoff message as early as possible so the channel
        # shows a run is running. The result step (Slack Notify) updates this same
        # message with the final status and threads the detailed breakdown under it,
        # so each run is one collapsible entry per environment. Never fail the job on
        # a Slack hiccup - the ts output stays empty and the result posts standalone.
        if: ${{ always() && env.SEND_SLACK == 'true' }}
        continue-on-error: true
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_QA_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID_TESTS }}
        shell: bash
        run: |
          pip install --quiet slack_sdk
          python - <<'PY'
          import os
          import time
          from slack_sdk import WebClient

          token = os.environ.get("SLACK_TOKEN", "")
          channel = os.environ.get("SLACK_CHANNEL", "")
          if not token or not channel:
              print("Slack token/channel not configured - skipping kickoff")
              raise SystemExit(0)

          env_name = os.environ.get("TEST_ENV", "stage").upper()
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          actor = os.environ.get("GITHUB_ACTOR", "")
          start_epoch = int(time.time())
          # Slack renders <!date^EPOCH^{format}|fallback> in each viewer's timezone.
          started_at = f"<!date^{start_epoch}^{{date_short_pretty}} at {{time}}|started>"
          message = (
              f"⏳ 📊 [{env_name}] CommCare-Connect Playwright Web Tests — Run #{run_number}\n"
              f"👤 Triggered by: {actor}\n"
              f"🚧 Status: In progress…\n"
              f"🕒 Started: {started_at}\n"
              f"🔗 Run: <{run_url}|View on GitHub>"
          )
          resp = WebClient(token=token).chat_postMessage(channel=channel, text=message)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"ts={resp['ts']}\n")
              out.write(f"channel={resp['channel']}\n")
              out.write(f"start_epoch={start_epoch}\n")
          print(f"Kickoff posted (ts={resp['ts']}, start_epoch={start_epoch})")
          PY

      - name: Install dependencies
        run: pip install -r playwright_web/requirements.txt pytest-html

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Framework Unit Tests
        working-directory: playwright_web
        # Fast sanity gate on the framework itself. Deliberately kept out of the
        # HTML report / notifications - those cover the browser tests only.
        run: python -m pytest tests/unit --tb=short

      - name: Run Playwright Web Tests
        working-directory: playwright_web
        # pytest.ini forces --headed for local debugging, so give CI a virtual display.
        run: |
          MARKER_ARGS=()
          [ -n "$PYTEST_MARKERS" ] && MARKER_ARGS=(-m "$PYTEST_MARKERS")
          xvfb-run --auto-servernum -- python -m pytest --ignore=tests/unit "${MARKER_ARGS[@]}" --env=${{ env.TEST_ENV }} --screenshot=only-on-failure --output=test-results --junitxml=reports/playwright-web-${{ env.TEST_ENV }}.xml --html=reports/report-playwright-web-${{ env.TEST_ENV }}.html --self-contained-html --tb=short

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-playwright-web-${{ env.TEST_ENV }}
          path: playwright_web/reports/playwright-web-${{ env.TEST_ENV }}.xml
          if-no-files-found: ignore

      - name: Upload HTML report
        id: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-playwright-web-${{ env.TEST_ENV }}
          path: playwright_web/reports/report-playwright-web-${{ env.TEST_ENV }}.html
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-web-failure-artifacts-${{ env.TEST_ENV }}
          path: playwright_web/test-results/
          if-no-files-found: ignore

      - name: Parse Results
        id: aggregate
        if: always()
        shell: bash
        run: |
          file="playwright_web/reports/playwright-web-${TEST_ENV}.xml"
          total=0; failed=0; errors=0; skipped=0; messaging_excluded=0
          if [ -f "$file" ]; then
            t=$(grep -o 'tests="[0-9]*"' "$file" | grep -o '[0-9]*' | head -1)
            f=$(grep -o 'failures="[0-9]*"' "$file" | grep -o '[0-9]*' | head -1)
            e=$(grep -o 'errors="[0-9]*"' "$file" | grep -o '[0-9]*' | head -1)
            s=$(grep -o 'skipped="[0-9]*"' "$file" | grep -o '[0-9]*' | head -1)
            total=${t:-0}; failed=${f:-0}; errors=${e:-0}; skipped=${s:-0}
            # Messaging tests skipped because messaging is disabled on this env
            # carry a sentinel in their skip reason - report them as "not included"
            # rather than lumping them into the genuine skipped count (per QA lead).
            messaging_excluded=$(grep -c 'MESSAGING-EXCLUDED' "$file" || true)
          fi
          # Keep Skipped for genuine skips only.
          skipped=$((skipped - messaging_excluded))
          [ "$skipped" -lt 0 ] && skipped=0
          total_failed=$((failed + errors))
          passed=$((total - total_failed - skipped - messaging_excluded))
          if [ "$total_failed" -gt 0 ] || [ "$total" -eq 0 ]; then
            status="FAILURE"
          else
            status="SUCCESS"
          fi
          {
            echo "status=$status"
            echo "passed=$passed"
            echo "failed=$total_failed"
            echo "errors=$errors"
            echo "skipped=$skipped"
            echo "messaging_excluded=$messaging_excluded"
          } >> $GITHUB_OUTPUT

      - name: Send Email Report
        if: ${{ always() && env.SEND_EMAIL == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.FROM_EMAIL_USERNAME }}
          password: ${{ secrets.FROM_EMAIL_PASSWORD }}
          subject: >
            CommCare-Connect Playwright Web ${{ env.TEST_ENV }} -
            ${{ steps.aggregate.outputs.status }} -
            Run #${{ github.run_number }}
          to: ${{ secrets.TO_EMAIL_USERNAME }}, qa@dimagi.com, anshu.shaik@fissionlabs.com, sameena.shaik@fissionlabs.com
          from: ${{ secrets.FROM_EMAIL_USERNAME }}
          html_body: |
            <h2>CommCare-Connect Playwright Web Report - ${{ env.TEST_ENV }}</h2>
            <p><b>Run:</b> #${{ github.run_number }}</p>
            <p><b>Branch:</b> ${{ github.head_ref || github.ref_name }}</p>
            <p><b>Triggered by:</b> ${{ github.actor }}</p>
            <h3>Results</h3>
            <ul>
              <li><b>Passed:</b> ${{ steps.aggregate.outputs.passed }}</li>
              <li><b>Failed:</b> ${{ steps.aggregate.outputs.failed }}</li>
              <li><b>Errors:</b> ${{ steps.aggregate.outputs.errors }}</li>
              <li><b>Skipped:</b> ${{ steps.aggregate.outputs.skipped }}</li>
            </ul>
            ${{ steps.aggregate.outputs.messaging_excluded != '0' && '<p><b>Messaging tests not included</b> (messaging disabled on this environment).</p>' || '' }}
            <br>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
            View Full Run
            </a>
          attachments: playwright_web/reports/report-playwright-web-${{ env.TEST_ENV }}.html

      - name: Slack Notify
        if: ${{ always() && env.SEND_SLACK == 'true' }}
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_QA_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID_TESTS }}
          STATUS: ${{ steps.aggregate.outputs.status }}
          PASSED: ${{ steps.aggregate.outputs.passed }}
          FAILED: ${{ steps.aggregate.outputs.failed }}
          SKIPPED: ${{ steps.aggregate.outputs.skipped }}
          MESSAGING_EXCLUDED: ${{ steps.aggregate.outputs.messaging_excluded }}
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
          # ts/channel of the kickoff message posted by Slack Start Notify. Empty if
          # that step could not post - we then fall back to a standalone message.
          START_TS: ${{ steps.slack_start.outputs.ts }}
          START_CHANNEL: ${{ steps.slack_start.outputs.channel }}
          START_EPOCH: ${{ steps.slack_start.outputs.start_epoch }}
        shell: bash
        run: |
          # matplotlib is only needed for the donut chart; the run still reports if
          # it (or the files:write scope) is unavailable - the chart is best-effort.
          pip install --quiet slack_sdk matplotlib
          python - <<'PY'
          import os
          import time
          from slack_sdk import WebClient

          token = os.environ.get("SLACK_TOKEN", "")
          channel = os.environ.get("SLACK_CHANNEL", "")
          if not token or not channel:
              print("Slack token/channel not configured - skipping")
              raise SystemExit(0)

          env_name = os.environ.get("TEST_ENV", "stage").upper()
          status = os.environ.get("STATUS", "FAILURE")
          icon = "✅" if status == "SUCCESS" else "❌"
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"

          artifact_url = os.environ.get("ARTIFACT_URL") or run_url
          actor = os.environ.get("GITHUB_ACTOR", "")
          passed = int(os.environ.get("PASSED", "0") or "0")
          failed = int(os.environ.get("FAILED", "0") or "0")
          skipped = int(os.environ.get("SKIPPED", "0") or "0")
          messaging_excluded = int(os.environ.get("MESSAGING_EXCLUDED", "0") or "0")
          messaging_line = "\n📵 Messaging tests not included" if messaging_excluded else ""

          # Timing: start epoch comes from the kickoff step; end is now. If the
          # kickoff could not post (no start epoch), fall back to just the end time.
          end_epoch = int(time.time())
          start_epoch = int(os.environ.get("START_EPOCH", "0") or "0")
          ended_at = f"<!date^{end_epoch}^{{date_short_pretty}} at {{time}}|ended>"
          if start_epoch:
              secs = max(0, end_epoch - start_epoch)
              elapsed = f"{secs // 3600}h {secs % 3600 // 60}m {secs % 60}s" if secs >= 3600 \
                  else f"{secs // 60}m {secs % 60}s"
              started_at = f"<!date^{start_epoch}^{{date_short_pretty}} at {{time}}|started>"
              timing_line = f"\n🕒 {started_at} → {ended_at}  (⏱ {elapsed})"
          else:
              timing_line = f"\n🕒 Ended: {ended_at}"

          def emoji_bar(width=20):
              """A proportional pass/fail/skip ratio bar (Option A)."""
              total = passed + failed + skipped
              if total == 0:
                  return ""
              g = round(width * passed / total)
              r = round(width * failed / total)
              y = max(0, width - g - r)  # skipped fills the remainder
              pct = round(100 * passed / total)
              return f"\n{'🟩' * g}{'🟥' * r}{'⬜' * y}  {pct}% passed"

          bar = emoji_bar()

          # The top-line summary that replaces the "in progress" kickoff message.
          summary = (
              f"{icon} 📊 [{env_name}] CommCare-Connect Playwright Web Tests — Run #{run_number}\n"
              f"👤 Triggered by: {actor}\n"
              f"🌐 Web → ✅ {passed} | ❌ {failed} | ⏭ {skipped}"
              f"{messaging_line}"
              f"{bar}"
              f"{timing_line}\n"
              f"🔗 Run: <{run_url}|View on GitHub>"
          )
          # Threaded reply: anchors the detail without repeating the summary's
          # counts/bar/messaging/timer lines - the donut below carries the
          # breakdown and this just states the result and links the full report.
          detail = (
              f"{icon} Result: {status}\n"
              f"📎 Report: <{artifact_url}|Download here>"
          )

          def build_donut():
              """Render a pass/fail/skip donut PNG (Option B). Best-effort."""
              segs = [("Passed", passed, "#2eb67d"),
                      ("Failed", failed, "#e01e5a"),
                      ("Skipped", skipped, "#9aa0a6")]
              if messaging_excluded:
                  segs.append(("Msg excluded", messaging_excluded, "#ecb22e"))
              segs = [(lbl, val, col) for lbl, val, col in segs if val > 0]
              total = sum(val for _, val, _ in segs)
              if total == 0:
                  return None
              import matplotlib
              matplotlib.use("Agg")
              import matplotlib.pyplot as plt
              fig, ax = plt.subplots(figsize=(4.2, 4.2))
              ax.pie([v for _, v, _ in segs],
                     labels=[f"{l} ({v})" for l, v, _ in segs],
                     colors=[c for _, _, c in segs],
                     startangle=90, counterclock=False,
                     wedgeprops={"width": 0.42, "edgecolor": "white"},
                     textprops={"fontsize": 10})
              ax.text(0, 0, f"{total}\ntests", ha="center", va="center",
                      fontsize=15, fontweight="bold")
              ax.set_title(f"[{env_name}] Run #{run_number} — {status}", fontsize=12)
              path = "/tmp/run-result.png"
              fig.savefig(path, bbox_inches="tight", dpi=110)
              plt.close(fig)
              return path

          client = WebClient(token=token)
          start_ts = os.environ.get("START_TS", "")
          start_channel = os.environ.get("START_CHANNEL", "") or channel

          if start_ts:
              # Flip the kickoff message to the final status, then thread the detail.
              client.chat_update(channel=start_channel, ts=start_ts, text=summary)
              client.chat_postMessage(channel=start_channel, thread_ts=start_ts, text=detail)
              print(f"Kickoff {start_ts} updated and result threaded")
              chart_ts, chart_channel = start_ts, start_channel
          else:
              # No kickoff to attach to - post the full result standalone.
              posted = client.chat_postMessage(channel=channel, text=summary + "\n" + detail)
              print("Slack notification sent (standalone - no kickoff ts)")
              chart_ts, chart_channel = posted["ts"], channel

          # Upload the donut into the thread. Never fail the build on chart problems
          # (missing files:write scope, matplotlib import, etc.).
          try:
              path = build_donut()
              if path:
                  client.files_upload_v2(
                      channel=chart_channel, thread_ts=chart_ts, file=path,
                      title=f"{env_name} Run #{run_number} results",
                      filename="run-result.png",
                  )
                  print("Donut chart uploaded to thread")
              else:
                  print("No tests to chart - skipping donut")
          except Exception as exc:  # noqa: BLE001
              print(f"Chart upload skipped: {exc}")
          PY
