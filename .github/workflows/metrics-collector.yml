name: Metrics Collector

on:
  workflow_run:
    workflows:
      - "CommCare-Connect Pytest Automation Suite"
    types: [completed]
    branches:
      - main

  workflow_dispatch:
    inputs:
      latest_runs:
        description: "Ingest latest N completed runs"
        required: false
        default: "30"
      cleanup_slack:
        description: "Delete all old QA-Bot messages in dashboard channel"
        required: false
        default: "true"

  schedule:
    - cron: "30 18 * * *"   # 12:00 AM IST

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: metrics-collector
  cancel-in-progress: false

jobs:
  collect:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout metrics branch
        uses: actions/checkout@v4
        with:
          ref: metrics
          fetch-depth: 0

      - name: Resolve run IDs to ingest
        id: runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const ALLOWED = new Set(["CommCare-Connect Pytest Automation Suite"]);

            if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;

              if (!["success", "failure"].includes(run.conclusion)) {
                core.info(`Skipping run ${run.id} with conclusion=${run.conclusion}`);
                core.setOutput("ids", JSON.stringify([]));
                return;
              }

              if (!ALLOWED.has(run.name)) {
                core.info(`Skipping workflow not in allowlist: ${run.name}`);
                core.setOutput("ids", JSON.stringify([]));
                return;
              }

              core.setOutput("ids", JSON.stringify([run.id]));
              return;
            }

            const limit = Number(core.getInput("latest_runs") || "10");

            const res = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo,
              status: "completed",
              per_page: Math.min(100, limit * 5),
            });

            const ids = res.data.workflow_runs
              .filter(r => ALLOWED.has(r.name))
              .slice(0, limit)
              .map(r => r.id);

            core.info(`Selected ${ids.length} run(s) from allowlisted workflows`);
            core.setOutput("ids", JSON.stringify(ids));

      - name: Download run-summary artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs  = require("fs");
            const ids = JSON.parse(`${{ steps.runs.outputs.ids }}`);
            fs.mkdirSync("incoming", { recursive: true });

            for (const runId of ids) {
              const arts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                run_id: runId,
              });

              for (const a of arts.data.artifacts.filter(x => x.name.startsWith("run-summary"))) {
                const zip = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  artifact_id: a.id,
                  archive_format: "zip",
                });
                fs.writeFileSync(`incoming/${runId}__${a.name}.zip`, Buffer.from(zip.data));
              }
            }

      - name: Unzip artifacts (safe)
        run: |
          shopt -s nullglob
          found=false
          for z in incoming/*.zip; do
            found=true
            d="${z%.zip}"
            mkdir -p "$d"
            unzip -o "$z" -d "$d" >/dev/null
          done
          if [ "$found" = false ]; then
            echo "No artifacts to unzip"
          fi

      - name: Append to metrics dataset (deduped)
        run: |
          set -e
          mkdir -p metrics
          touch metrics/runs.jsonl

          # Remove any lines that are not valid JSON objects with a timestamp
          python <<'CLEAN'
          import json
          path = "metrics/runs.jsonl"
          lines = open(path, encoding="utf-8").read().splitlines()
          clean = []
          for line in lines:
              line = line.strip()
              if not line:
                  continue
              try:
                  obj = json.loads(line)
                  if isinstance(obj, dict) and obj.get("timestamp_utc"):
                      clean.append(line)
              except Exception:
                  pass
          with open(path, "w", encoding="utf-8") as f:
              f.write("\n".join(clean) + ("\n" if clean else ""))
          CLEAN

          python <<'PY'
          import json, os

          existing_ids = set()
          if os.path.exists("metrics/runs.jsonl"):
              with open("metrics/runs.jsonl") as f:
                  for line in f:
                      try:
                          obj = json.loads(line)
                          rid   = (obj.get("github", {}).get("run_id") or obj.get("run_id"))
                          scope = obj.get("scope", "")
                          env   = obj.get("env") or obj.get("environment", "")
                          if rid:
                              existing_ids.add(f"{rid}__{scope}__{env}")
                      except Exception:
                          pass

          ALLOWED_ENVS   = {"stage", "prod"}
          ALLOWED_SCOPES = {"web", "mobile"}

          added = 0
          skipped_unknown = 0
          with open("metrics/runs.jsonl", "a", encoding="utf-8") as out:
              for root, _, files in os.walk("incoming"):
                  for name in files:
                      if name == "run_summary.json":
                          path = os.path.join(root, name)
                          with open(path, encoding="utf-8") as fh:
                              obj = json.load(fh)

                          rid   = (obj.get("github", {}).get("run_id") or obj.get("run_id"))
                          if not rid:
                              continue

                          rid   = str(rid)
                          scope = (obj.get("scope") or "").lower()
                          env   = obj.get("env") or obj.get("environment", "")

                          if env not in ALLOWED_ENVS:
                              print(f"Skipping run {rid} ({scope}) with unrecognised env: {env!r}")
                              skipped_unknown += 1
                              continue

                          if scope and scope not in ALLOWED_SCOPES:
                              print(f"Skipping run {rid} with unrecognised scope: {scope!r}")
                              skipped_unknown += 1
                              continue

                          key = f"{rid}__{scope}__{env}"
                          if key in existing_ids:
                              continue

                          out.write(json.dumps(obj, ensure_ascii=False) + "\n")
                          existing_ids.add(key)
                          added += 1

          print(f"Added {added} new run(s), skipped {skipped_unknown} with unrecognised env/scope")
          PY

      - name: Commit metrics
        run: |
          git config user.name "metrics-bot"
          git config user.email "metrics-bot@users.noreply.github.com"
          git add metrics/runs.jsonl
          git commit -m "Metrics update ${GITHUB_RUN_ID}" || echo "No new metrics"
          git push origin metrics

  publish_dashboard:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@v4
        with:
          ref: metrics

      - run: |
          rm -rf site
          mkdir -p site/data
          cp dashboard/index.html site/index.html
          cp metrics/runs.jsonl   site/data/runs.jsonl

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4

  daily_digest:
    needs: publish_dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: metrics
          fetch-depth: 0

      - name: Generate AI insights
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pip install openai --quiet
          python dashboard/generate_insights.py --days 14
          git config user.name "metrics-bot"
          git config user.email "metrics-bot@users.noreply.github.com"
          git add metrics/latest_insight.txt || true
          git commit -m "Update AI dashboard insights" || echo "No changes"
          git push origin metrics || echo "Nothing to push"

      - name: Build Slack summary
        run: |
          python - <<'PY'
          import json, datetime
          from collections import defaultdict

          IST    = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          now    = datetime.datetime.now(IST)
          cutoff = now - datetime.timedelta(hours=24)

          ALLOWED_ENVS   = {"stage", "prod"}
          ALLOWED_SCOPES = {"web", "mobile"}

          # stats[env][scope] = {pass, fail}
          stats = defaultdict(lambda: defaultdict(lambda: {"pass": 0, "fail": 0}))
          total = 0

          with open("metrics/runs.jsonl", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      r = json.loads(line)
                  except Exception:
                      continue

                  ts = r.get("timestamp_utc")
                  if not ts:
                      continue

                  t = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
                  if t < cutoff:
                      continue

                  env   = r.get("env") or r.get("environment", "")
                  scope = (r.get("scope") or "unknown").lower()

                  if env not in ALLOWED_ENVS:
                      continue

                  total += 1
                  bucket = "pass" if (r.get("status") or "").lower() == "pass" else "fail"
                  stats[env][scope][bucket] += 1

          env_order   = ["stage", "prod"]
          scope_order = ["web", "mobile"]

          def env_block(env):
              lines = []
              for sc in scope_order:
                  s = stats[env][sc]
                  lines.append(f"    \u2022 {sc}: \u2705 {s['pass']} | \u274c {s['fail']}")
              return "\n".join(lines)

          sections = []
          for env in env_order:
              sections.append(f"*{env.upper()}*\n{env_block(env)}")

          fail_total = sum(
              stats[e][sc]["fail"]
              for e in ALLOWED_ENVS
              for sc in ALLOWED_SCOPES
          )
          fail_rate = round((fail_total / total * 100), 1) if total else 0

          msg = (
              "\U0001f4ca *CommCare-Connect Automation Dashboard (last 24h)*\n\n"
              + "\n\n".join(sections)
              + f"\n\n\u2022 Runs: *{total}*\n"
              + f"\u2022 Fail rate: *{fail_rate}%*\n\n"
              + "\U0001f517 https://dimagi.github.io/dimagi-qa-ccc/"
          )

          with open("slack_message.txt", "w", encoding="utf-8") as out:
              out.write(msg)
          PY

      - name: Cleanup old Slack messages (QA-Bot)
        if: ${{ github.event_name != 'workflow_run' }}
        env:
          SLACK_TOKEN:   ${{ secrets.SLACK_QA_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID_DASHBOARD }}
        run: |
          set -euo pipefail

          AUTH="$(curl -sS https://slack.com/api/auth.test \
            -H "Authorization: Bearer ${SLACK_TOKEN}")"

          if [ "$(echo "$AUTH" | jq -r '.ok')" != "true" ]; then
            echo "auth.test failed:"
            echo "$AUTH" | jq .
            exit 1
          fi

          BOT_USER_ID="$(echo "$AUTH" | jq -r '.user_id')"
          echo "Bot user id: $BOT_USER_ID"

          CURSOR=""
          DELETED=0

          while : ; do
            if [ -n "$CURSOR" ]; then
              HIST="$(curl -sS https://slack.com/api/conversations.history \
                -H "Authorization: Bearer ${SLACK_TOKEN}" \
                --get \
                --data-urlencode "channel=${SLACK_CHANNEL}" \
                --data-urlencode "limit=200" \
                --data-urlencode "cursor=${CURSOR}")"
            else
              HIST="$(curl -sS https://slack.com/api/conversations.history \
                -H "Authorization: Bearer ${SLACK_TOKEN}" \
                --get \
                --data-urlencode "channel=${SLACK_CHANNEL}" \
                --data-urlencode "limit=200")"
            fi

            if [ "$(echo "$HIST" | jq -r '.ok')" != "true" ]; then
              echo "conversations.history failed:"
              echo "$HIST" | jq .
              exit 1
            fi

            TS_LIST="$(echo "$HIST" | jq -r --arg u "$BOT_USER_ID" '.messages[] | select(.user==$u) | .ts')"

            if [ -n "$TS_LIST" ]; then
              while IFS= read -r TS; do
                [ -z "$TS" ] && continue
                RESP="$(curl -sS -X POST https://slack.com/api/chat.delete \
                  -H "Authorization: Bearer ${SLACK_TOKEN}" \
                  -H "Content-Type: application/json; charset=utf-8" \
                  --data "$(jq -n --arg channel "$SLACK_CHANNEL" --arg ts "$TS" \
                    '{channel:$channel, ts:$ts}')")"

                if [ "$(echo "$RESP" | jq -r '.ok')" = "true" ]; then
                  DELETED=$((DELETED+1))
                else
                  echo "Failed to delete ts=$TS:"
                  echo "$RESP" | jq .
                fi
              done <<< "$TS_LIST"
            fi

            CURSOR="$(echo "$HIST" | jq -r '.response_metadata.next_cursor // ""')"
            [ -z "$CURSOR" ] && break
          done

          echo "Deleted $DELETED old QA-Bot messages."
          rm -f metrics/slack_state.json || true

      - name: Post or update Slack message
        env:
          SLACK_TOKEN:   ${{ secrets.SLACK_QA_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID_DASHBOARD }}
        run: |
          set -euo pipefail

          mkdir -p metrics
          STATE_FILE="metrics/slack_state.json"

          PREV_TS=""
          if [ -f "$STATE_FILE" ]; then
            PREV_TS="$(python -c "import json; print((json.load(open('$STATE_FILE')) or {}).get('ts',''))" 2>/dev/null || true)"
          fi

          TEXT="$(cat slack_message.txt)"

          if [ -n "${PREV_TS}" ]; then
            echo "Updating existing Slack message ts=${PREV_TS}"
            RESP="$(curl -sS -X POST https://slack.com/api/chat.update \
              -H "Authorization: Bearer ${SLACK_TOKEN}" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "$(jq -n --arg channel "$SLACK_CHANNEL" --arg ts "$PREV_TS" --arg text "$TEXT" \
                '{channel:$channel, ts:$ts, text:$text}')")"
          else
            echo "Posting new Slack message"
            RESP="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_TOKEN}" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "$(jq -n --arg channel "$SLACK_CHANNEL" --arg text "$TEXT" \
                '{channel:$channel, text:$text}')")"
          fi

          if [ "$(echo "$RESP" | jq -r '.ok')" != "true" ]; then
            echo "Slack API error:"
            echo "$RESP" | jq .
            exit 1
          fi

          NEW_TS="$(echo "$RESP" | jq -r '.ts')"
          echo "Slack message ts=${NEW_TS}"
          echo "$RESP" | jq '{ts: .ts, channel: .channel}' > "$STATE_FILE"

      - name: Commit Slack state
        run: |
          git config user.name "metrics-bot"
          git config user.email "metrics-bot@users.noreply.github.com"
          git add metrics/slack_state.json || true
          git commit -m "Update Slack dashboard message state" || echo "No changes"
          git push origin metrics
