[pytest]
; No -s here: output capture must stay on so executed steps appear per-test
; in the pytest-html report. Pass -s manually when debugging locally.
addopts = -v --headed
testpaths = tests
pythonpath = .

markers =
    on_demand: tests that drive a real device (BrowserStack Maestro build) - run
        on-demand / nightly, excluded from the per-PR gate with -m "not on_demand".
    pending_prod(pr): updated or new test for a commcare-connect PR - runs only where
        that PR's code is deployed (see utils/pr_gating.py).
    replaced_by_pr(pr): original test an updated copy replaces - skipped once that
        commcare-connect PR's code is deployed (see utils/pr_gating.py).

; Report reading order, pinned rather than left to pytest-html's defaults:
; failures (and errors) sort to the top and render expanded with their step log
; and failure screenshots; passed and skipped rows stay collapsed as noise.
initial_sort = result
render_collapsed = passed,skipped
