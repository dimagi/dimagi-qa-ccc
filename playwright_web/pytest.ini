[pytest]
; No -s here: output capture must stay on so executed steps appear per-test
; in the pytest-html report. Pass -s manually when debugging locally.
addopts = -v --headed
testpaths = tests
pythonpath = .

; Report reading order, pinned rather than left to pytest-html's defaults:
; failures (and errors) sort to the top and render expanded with their step log
; and failure screenshots; passed and skipped rows stay collapsed as noise.
initial_sort = result
render_collapsed = passed,skipped
